<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ODYSSEY · A Text Film</title>
<style>
/* ============================================================================
   A TEXT FILM.

   Every other page in this project is a console — lists, tabs, a player. This
   one is a screen. The picture is the whole page, the chrome gets out of the
   way, and the only other thing on it is the passage the picture is made of,
   set so you can read it while you watch it being used as ink.

   No colour, for the same reason the film has none: eight levels, cream paper,
   hard contour. The only two voices are the machine's monospace and Homer's
   serif, and here they are the same thing — the mosaic is monospace because a
   halftone cell is a fixed width, and the passage under it is serif because it
   is being read rather than measured.
========================================================================== */
:root{
  --paper:#FBFAF4; --ink:#141210; --ink6:#3A3630; --ink3:#6E6A62;
  --ink1:#C7C3B8; --rule:#DCD8CC; --field:#F4F2EA;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{--paper:#0C0B09;--ink:#F2EFE6;--ink6:#C6C1B4;
  --ink3:#8B877E;--ink1:#3C3830;--rule:#26231E;--field:#151310;}}
:root[data-theme="dark"]{--paper:#0C0B09;--ink:#F2EFE6;--ink6:#C6C1B4;
  --ink3:#8B877E;--ink1:#3C3830;--rule:#26231E;--field:#151310;}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

header{display:flex;align-items:baseline;gap:10px 22px;flex-wrap:wrap;
  padding:16px 22px 12px;border-bottom:1px solid var(--rule)}
h1{font-family:var(--mono);font-size:15px;letter-spacing:.06em;margin:0;font-weight:600}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.src{display:flex;gap:5px}
.src button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  background:none;border:1px solid var(--ink1);color:var(--ink3);padding:5px 10px;cursor:pointer}
.src button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pick{padding:9px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;
  font-family:var(--mono);font-size:11px}
.pick select{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--ink1);
  padding:5px 7px;max-width:230px}
.back{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);text-decoration:none;border:1px solid var(--ink1);padding:5px 11px}
.back:hover{color:var(--ink);border-color:var(--ink)}

main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
@media(max-width:920px){main{grid-template-columns:1fr;grid-template-rows:1fr auto}}

.screen{position:relative;display:flex;align-items:center;justify-content:center;
  padding:18px;min-height:0;background:var(--field);border-right:1px solid var(--rule)}
@media(max-width:920px){.screen{border-right:none;border-bottom:1px solid var(--rule)}}
canvas{max-width:100%;max-height:100%;display:block;background:var(--paper);
  border:1px solid var(--rule)}
.slug{position:absolute;left:26px;top:26px;font-family:var(--mono);font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}

aside{display:flex;flex-direction:column;min-height:0}
.meta{padding:18px 20px 10px;border-bottom:1px solid var(--rule)}
.meta h2{font-family:var(--mono);font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.meta .why{font-size:15px;color:var(--ink6);text-wrap:pretty}
.meta .sc{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-top:8px}
.passage{flex:1;overflow:auto;padding:16px 20px 24px;font-size:15.5px;line-height:1.62;
  color:var(--ink6);text-wrap:pretty}
.passage b{color:var(--ink);font-weight:600}

.deck{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;
  border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px}
.deck button{font:inherit;letter-spacing:.1em;text-transform:uppercase;background:none;
  border:1px solid var(--ink1);color:var(--ink);padding:6px 11px;cursor:pointer}
.deck button:hover{border-color:var(--ink)}
.deck button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.deck label{color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
input[type=range]{width:104px;accent-color:var(--ink)}
.strip{display:flex;gap:5px;overflow-x:auto;padding:10px 20px 14px;border-top:1px solid var(--rule)}
.strip button{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;background:none;border:1px solid var(--ink1);color:var(--ink3);
  padding:5px 8px;cursor:pointer;white-space:nowrap}
.strip button[aria-current="true"]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
</style>
</head><body>

<header>
  <h1>A TEXT FILM</h1>
  <span class="tag" id="count">loading…</span>
  <span class="src" id="src">
    <button data-src="scenes" aria-pressed="true">Scenes</button>
    <button data-src="assets" aria-pressed="false">Assets</button>
    <button data-src="things" aria-pressed="false">Things</button>
    <button data-src="faces"  aria-pressed="false">Faces</button>
  </span>
  <a class="back" href="index.html">← index</a>
</header>

<main>
  <div class="screen">
    <span class="slug" id="slug"></span>
    <canvas id="cv" width="1000" height="1000"></canvas>
  </div>

  <aside>
    <div class="meta">
      <h2 id="title">—</h2>
      <div class="why" id="why"></div>
      <div class="sc" id="sc"></div>
    </div>
    <div class="passage" id="passage"></div>
    <div class="deck">
      <button id="play" aria-pressed="true">❚❚</button>
      <button id="prev">◀</button>
      <button id="next">▶</button>
      <button id="mode">BREATH</button>
      <label for="cell">grain</label>
      <input type="range" id="cell" min="5" max="22" value="9">
      <span id="cellv" style="color:var(--ink3)">9</span>
      <label for="em">emerge</label>
      <input type="range" id="em" min="0" max="100" value="0">
      <button id="auto" aria-pressed="true">auto</button>
    </div>
    <div class="pick"><label for="sel">item</label>
      <select id="sel"></select>
      <span id="pos" style="color:var(--ink3)"></span></div>
    <div class="strip" id="strip"></div>
  </aside>
</main>

<script type="module">
/* ============================================================================
   The picture is printed out of the words of its own scene.

   Nothing here is written for this page. The forms come from
   scenes/_artifacts.mjs — twenty-one things, each performing the one argument
   it has in the poem. The text comes from the two files the film speaks from:
   viewer/spoken-lines.json for authored lines, drive/drive-script.json for
   everything else, joined in segment order. So the characters you are reading
   as ink are the characters you would be hearing at that moment.

   That is the whole idea, and it only works because the printer was already
   built this way: engine/glyphs.mjs replaces the halftone's dot with a mark
   and changes nothing else — same ink law, same eight levels, same grade.
========================================================================== */
import { ARTIFACTS } from "./scenes/_artifacts.mjs";
import { FACES, drawCloseup, idleFace } from "./assets/character/_close/face.mjs";
import * as DIR from "./scenes/_direction.mjs";
import * as GLYPH from "./engine/glyphs.mjs";
import * as E from "./engine/halfworld-engine.mjs";

const $ = (s) => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
const src = document.createElement("canvas");
const sg = src.getContext("2d", { willReadFrequently: true });
const msk = document.createElement("canvas");
const mg = msk.getContext("2d", { willReadFrequently: true });
/* the previous frame, kept so the printer can ask what moved */
let prevData = null, prevKey = "";

/* ---- the two sources the film speaks from ------------------------------- */
let SCRIPT = null, SPOKEN = {};
try {
  const [a, b] = await Promise.all([
    fetch("./drive/drive-script.json").then((r) => r.json()),
    fetch("./viewer/spoken-lines.json").then((r) => r.json()).catch(() => ({ lines: {} })),
  ]);
  SCRIPT = a; SPOKEN = (b && b.lines) || {};
} catch (e) { }

const lineOf = (d) => (d && d.sourceTurnId && SPOKEN[d.sourceTurnId] && SPOKEN[d.sourceTurnId].line) || "";
const _txt = new Map();
function passageOf(sceneId) {
  if (_txt.has(sceneId)) return _txt.get(sceneId);
  const sc = SCRIPT && SCRIPT.scenes.find((x) => x.id === sceneId);
  const parts = sc ? (sc.segments || []).map((d) => lineOf(d) || String(d.text || "")).filter(Boolean) : [];
  const joined = parts.join(" ").replace(/\s+/g, " ").trim() || "THE ODYSSEY ";
  const out = { text: joined, parts, title: sc ? sc.title : sceneId, book: sc ? sc.book : null };
  _txt.set(sceneId, out);
  return out;
}

/* ══ THE WHOLE FILM, NOT A SELECTION ════════════════════════════════════════
   glyphBlit takes a source canvas and knows nothing about what drew it. So
   anything this project can render can be printed in words: the twenty-one
   authored performances were only the first source, not the only one.

     SCENES  all 152, staged through the engine's own makeRestage — the same
             call syncwatch uses — so what is printed is the film's own frame
             at that moment, cast, blocking and all.
     ASSETS  all 430 in the manifest, each module drawn directly.
     THINGS  the 21 authored performances.
     FACES   the 12 principals, in their directed emotions.

   Everything is printed in the text of the scene it belongs to. An asset knows
   its scenes from the manifest; a face knows its beats from the direction file.
   Nothing here needed new data — only a source list.
══════════════════════════════════════════════════════════════════════════ */
let MF = null;
try { MF = await fetch("./viewer/manifest-lite.json").then((r) => r.json()); }
catch (e) { try { MF = await fetch("./viewer/odyssey-manifest.json").then((r) => r.json()); } catch (e2) {} }

const assetType = (id) => String(id).split(".")[0];
const _mod = new Map();
async function modOf(path) {
  if (_mod.has(path)) return _mod.get(path);
  let m = null;
  try { const im = await import("." + path); m = im.default || im.asset || im[Object.keys(im)[0]] || null; }
  catch (e) { m = null; }
  _mod.set(path, m); return m;
}

/* a scene, staged the way the film stages it */
const _stage = new Map();
async function stageOf(sceneId) {
  if (_stage.has(sceneId)) return _stage.get(sceneId);
  let rs = null;
  try {
    const im = await import(`./scenes/${sceneId}.mjs`);
    const sc = im.scene || im.default;
    const mods = new Map();
    await Promise.all((sc.cast || []).map(async (c) => {
      const a = MF && MF.assets.find((x) => x.id === c.asset);
      mods.set(c.asset, a ? await modOf(a.path) : null);
    }));
    rs = E.makeRestage(sc, (id) => mods.get(id), (id) => assetType(id), {});
  } catch (e) { rs = null; }
  _stage.set(sceneId, rs); return rs;
}

/* WHO OR WHAT IS BEING USED. For a scene that is the speaker of its key beat;
   failing that, the largest thing on the stage that is not a person, because a
   scene with no dialogue is usually about an object. The mask is that one
   element drawn ALONE on the same stage, so the letters land on its own
   silhouette instead of inside a box someone drew around it. */
function subjectOf(rs, sceneId, tS) {
  if (!rs) return null;
  let placed = null;
  try { placed = rs.layout(672, 456, tS); } catch (e) { return null; }
  if (!placed || !placed.length) return null;
  const want = faceGuess(sceneId);
  if (want) {
    const hit = placed.find((p) => p.figure && String(p.instance || "").toLowerCase().startsWith(want.slice(0, 5)));
    if (hit) return hit;
  }
  let obj = null;
  for (const q of placed) if (!q.figure && q.h > 0 && (!obj || q.h > obj.h)) obj = q;
  if (obj) return obj;
  return placed.find((p) => p.figure) || null;
}

/* ---- the four source lists --------------------------------------------- */
function buildSources() {
  const scenes = (MF ? MF.scenes : []).map((s) => ({
    kind: "scene", id: s.id, title: s.title || s.id, scene: s.id,
    note: `the film's own frame, staged`, sub: "SCENE",
  }));
  const assets = (MF ? MF.assets : []).map((a) => ({
    kind: "asset", id: a.id, title: a.name || a.id, path: a.path,
    scene: (a.scenes && a.scenes[0]) || null, sub: a.type.toUpperCase(),
    note: `${a.uses || 0} appearance${(a.uses || 0) === 1 ? "" : "s"} · books ${(a.books || []).join(", ") || "—"}`,
  }));
  const things = ARTIFACTS.map((a) => ({
    kind: "thing", id: a.id, title: a.title, scene: a.scene,
    note: a.note, sub: (a.kind || "thing").toUpperCase(), art: a,
  }));
  const faces = Object.keys(FACES).map((f) => {
    const beat = Object.entries(DIR.BEATS).find(([sc, [emo]]) => {
      return (DIR.FACE_OF && DIR.FACE_OF[sc]) === f;
    });
    const scn = Object.keys(DIR.BEATS).find((sc) => sc.length && faceGuess(sc) === f);
    return { kind: "face", id: f, title: f.toUpperCase(), scene: scn || null,
      note: "the close-up, printed in the line it speaks", sub: "FACE", face: f };
  });
  return { scenes, assets, things, faces };
}
/* which face a scene's key beat belongs to — recovered, not tabulated */
const _fg = new Map();
function faceGuess(sceneId) {
  if (_fg.has(sceneId)) return _fg.get(sceneId);
  const sc = SCRIPT && SCRIPT.scenes.find((x) => x.id === sceneId);
  let best = null, len = 0;
  for (const d of (sc && sc.segments) || []) {
    const L = (lineOf(d) || "").length;
    if (L > len) { len = L; best = d; }
  }
  const spId = best && best.speakerId;
  let out = null;
  if (spId && !/^PERFORMER\./.test(spId)) {
    const key = String(spId).split(".").slice(1).join(".").split("-")[0].replace(/s$/, "");
    out = Object.keys(FACES).find((n) => n === key || n.startsWith(key) || key.startsWith(n)) || null;
  }
  _fg.set(sceneId, out); return out;
}

/* ---- state -------------------------------------------------------------- */
let i = 0, playing = true, cell = 9, mode = "breath", t0 = performance.now();
let emerge = 0, emergeAuto = true;
/* MIX is the default, because it is the only one where both halves work: the
   frame stays a picture and the words stay a sentence. The pure modes are kept
   for comparison, and for the shots where a whole form in words is the point. */
const MODES = ["breath", "inhale", "page", "moving", "still", "mix", "mixinv", "spoken", "greek", "weight", "sea"];

function sizeCanvas() {
  const box = $(".screen").getBoundingClientRect();
  const s = Math.max(320, Math.floor(Math.min(box.width - 40, box.height - 40)));
  if (cv.width !== s) { cv.width = s; cv.height = s; }
}

let _pending = null;
function paint() {
  const it = LIST[i]; if (!it) return;
  const p = passageOf(it.scene || "");
  sizeCanvas();
  const px = cv.width;
  const u = ((performance.now() - t0) / (it.period || 5200)) % 1;
  src.width = px; src.height = px;
  sg.setTransform(1, 0, 0, 1, 0, 0);
  sg.fillStyle = "#ffffff"; sg.fillRect(0, 0, px, px);
  try {
    if (it.kind === "thing") it.art.draw(sg, px, px, u);
    else if (it.kind === "face") {
      const emo = it.scene && DIR.BEATS[it.scene] ? DIR.EMOTIONS[DIR.BEATS[it.scene][0]] : null;
      drawCloseup(sg, FACES[it.face], { ...idleFace(u * 6, it.face.length), ...(emo || {}) },
        { cx: px * .5, cy: px * .47, R: px * .40 });
    } else if (it.kind === "asset" && it._m) {
      it._m.draw(sg, px, px, { ...(it._m.preview ? it._m.preview() : {}), t: u, u, card: false });
    } else if (it.kind === "scene" && it._rs) {
      /* the film's own stage: 672x456 is the world, letterboxed into the square */
      const SW = 672, SH = 456, sc2 = px / SW, oy = (px - SH * sc2) / 2;
      sg.save(); sg.translate(0, oy); sg.scale(sc2, sc2);
      try { it._rs.stage(sg, SW, SH, u * 36); } catch (e) { }
      sg.restore();
    }
  } catch (e) { }
  const data = sg.getImageData(0, 0, px, px).data;
  const paper = getComputedStyle(document.body).backgroundColor;
  const ink = getComputedStyle(document.body).color;

  if (mode === "breath" || mode === "inhale") {
    /* the front travels, turns round, and comes back — so the page is never
       finished becoming a picture and never finished being read. `emerge`
       drives the front by hand when auto is off. */
    let ph = emerge;
    if (emergeAuto) {
      const cyc = ((performance.now() - t0) / 11000) % 1;
      ph = cyc < 0.5 ? cyc * 2 : (1 - cyc) * 2;
      $("#em").value = String(Math.round(ph * 100));
    }
    const r = GLYPH.breathBlit(ctx, data, px, px, { x: 0, y: 0, w: px, h: px }, px, px, cell,
      { text: p.text, grade: (d) => E.INKLAW.grade(d), paper, ink,
        back: mode === "inhale",
        wave: { dir: 0.55, len: 0.5, phase: ph * 1.35 - 0.18 } });
    if (r) $("#cellv").title = `${r.inTransition} cells mid-breath`;
    return;
  }

  if (mode === "page") {
    /* the page breathes from prose to picture and back, so the moment where it
       is both is the one you keep arriving at */
    if (emergeAuto) {
      const cyc = ((performance.now() - t0) / 9000) % 1;
      emerge = cyc < 0.5 ? cyc * 2 : (1 - cyc) * 2;
      $("#em").value = String(Math.round(emerge * 100));
    }
    const r = GLYPH.pageBlit(ctx, data, px, px, { x: 0, y: 0, w: px, h: px }, px, px, cell,
      { text: p.text, emerge, grade: (d) => E.INKLAW.grade(d), paper, ink });
    if (r) $("#cellv").title = `${r.lines} lines x ${r.cols} columns`;
    return;
  }

  if (mode === "moving" || mode === "still") {
    /* ── MOVEMENT WRITES ────────────────────────────────────────────────────
       The mask is not a thing here, it is a CHANGE. Difference this frame
       against the last one and the letters land wherever the picture moved:
       the shuttle crossing the loom, the jaw dropping, the sea under the raft.
       Everything holding still stays a drawing.

       So the frame reads as an image until something happens in it, and the
       instant it does, that part of the image turns back into the sentence it
       came from. Watching becomes reading exactly where there is motion, which
       is the opposite of how a film usually works — normally motion is the
       thing you cannot read.

       `still` inverts it: the moving parts stay picture and the STILL parts
       are text, which turns out to be the stranger of the two — a frame whose
       background is legible and whose action is not.
    ─────────────────────────────────────────────────────────────────────── */
    const key = it.id + "|" + px;
    msk.width = px; msk.height = px;
    const cur = data;
    if (!prevData || prevKey !== key || prevData.length !== cur.length) {
      /* first frame of a new subject: nothing has moved yet, so nothing is
         text — better a plain picture than a full page of noise */
      mg.fillStyle = "#ffffff"; mg.fillRect(0, 0, px, px);
    } else {
      const md = mg.createImageData(px, px), q2 = md.data;
      for (let k = 0; k < cur.length; k += 4) {
        const a2 = cur[k] * .299 + cur[k + 1] * .587 + cur[k + 2] * .114;
        const b2 = prevData[k] * .299 + prevData[k + 1] * .587 + prevData[k + 2] * .114;
        const moved = Math.abs(a2 - b2) > 26;
        q2[k] = q2[k + 1] = q2[k + 2] = moved ? 0 : 255; q2[k + 3] = 255;
      }
      mg.putImageData(md, 0, 0);
    }
    prevData = cur.slice(); prevKey = key;
    const mdata = mg.getImageData(0, 0, px, px).data;
    const r = GLYPH.mixBlit(ctx, data, mdata, px, px, { x: 0, y: 0, w: px, h: px }, px, px, cell,
      { text: p.text, grade: (d) => E.INKLAW.grade(d), paper, ink, invert: mode === "still" });
    if (r) $("#cellv").title = `${r.glyphCells} letters on ${mode === "still" ? "what holds" : "what moved"} · ${r.dotCells} dots`;
    return;
  }

  if (mode === "mix" || mode === "mixinv") {
    /* the mask: the subject alone, drawn on the same stage at the same scale */
    msk.width = px; msk.height = px;
    mg.setTransform(1, 0, 0, 1, 0, 0);
    mg.fillStyle = "#ffffff"; mg.fillRect(0, 0, px, px);
    try {
      if (it.kind === "scene" && it._rs) {
        const SW = 672, SH = 456, sc2 = px / SW, oy2 = (px - SH * sc2) / 2;
        const sub = subjectOf(it._rs, it.id, u * 36);
        if (sub && sub.it && sub.it.mod) {
          const cut = E.inkCutout(sub.it.mod, { pose: sub.it.c && sub.it.c.pose, t: u }, "mask", .895);
          let dh = sub.h * sc2, dw = dh * cut.ar;
          mg.save(); mg.translate(0, oy2); mg.scale(1, 1);
          mg.drawImage(cut.cv, cut.x, cut.y, cut.w, cut.h,
            sub.x * sc2 - dw / 2, sub.y * sc2 - dh, dw, dh);
          mg.restore();
        }
      } else {
        /* A THING HAS NO "REST OF THE SCENE" to be picture against, so making
           the whole form hot just reproduced pure-text mode under a different
           name. The rule that generalises: the letters land on the HEAVIEST
           INK — the part your eye already goes to. Threshold the form's own
           density and the mask is its darkest third, which for a face is the
           hair and the mouth, and for the bow is the stave and the string. */
        const d0 = sg.getImageData(0, 0, px, px);
        const q0 = d0.data;
        for (let k = 0; k < q0.length; k += 4) {
          const lum = (q0[k] * .299 + q0[k + 1] * .587 + q0[k + 2] * .114) / 255;
          const on = lum < 0.42;                       // the dark third
          q0[k] = q0[k + 1] = q0[k + 2] = on ? 0 : 255; q0[k + 3] = 255;
        }
        mg.putImageData(d0, 0, 0);
      }
    } catch (e) { }
    const mdata = mg.getImageData(0, 0, px, px).data;
    const r = GLYPH.mixBlit(ctx, data, mdata, px, px, { x: 0, y: 0, w: px, h: px }, px, px, cell,
      { text: p.text, grade: (d) => E.INKLAW.grade(d), paper, ink, invert: mode === "mixinv" });
    if (r) $("#cellv").title = `${r.glyphCells} letters · ${r.dotCells} dots`;
    return;
  }

  GLYPH.glyphBlit(ctx, data, px, px, { x: 0, y: 0, w: px, h: px }, px, px, cell,
    mode === "spoken"
      ? { text: p.text, grade: (d) => E.INKLAW.grade(d), paper, ink }
      : { set: mode, grade: (d) => E.INKLAW.grade(d), paper, ink });
}

/* rAF is throttled to zero in embedded panes, so a timer carries it and rAF
   only smooths it when the browser is willing. Same driver as the call page. */
let last = 0;
function frame(fromTimer) {
  if (playing) { last = performance.now(); paint(); }
  if (!fromTimer) requestAnimationFrame(frame);
}
setInterval(() => { if (playing && performance.now() - last > 130) frame(true); }, 70);
requestAnimationFrame(frame);

/* ---- the panel ---------------------------------------------------------- */
async function show() {
  const it = LIST[i]; if (!it) return;
  /* load whatever this source needs, once */
  if (it.kind === "asset" && !it._m) it._m = await modOf(it.path);
  if (it.kind === "scene" && !it._rs) it._rs = await stageOf(it.id);
  const p = passageOf(it.scene || "");
  $("#title").textContent = it.title;
  $("#why").textContent = it.note;
  $("#sc").textContent = `${it.scene || it.id}${p.book ? " · BOOK " + p.book : ""} · ${it.sub} · ${p.text.length} CHARACTERS`;
  $("#slug").textContent = it.title;
  /* the passage, with the first line emphasised so the eye has somewhere to
     start — you are meant to read this while it is being spent as ink */
  $("#passage").innerHTML = p.parts.map((s, n) =>
    n === 0 ? `<b>${esc(s)}</b>` : esc(s)).join(" ");
  $("#passage").scrollTop = 0;
  $("#sel").value = String(i);
  $("#pos").textContent = `${i + 1} / ${LIST.length}`;
  paint();
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function go(n) { i = (n + LIST.length) % LIST.length; t0 = performance.now(); show(); }

const SOURCES = buildSources();
let LIST = [];
function useSource(name) {
  LIST = SOURCES[name] || [];
  LIST.forEach((it, n) => { it.period = 4200 + (n % 9) * 520; });
  $("#sel").innerHTML = LIST.map((it, n) =>
    `<option value="${n}">${esc(it.title)}</option>`).join("");
  $("#count").textContent = `${LIST.length} ${name} · printed in their own words`;
  /* the strip keeps the 21 authored things reachable from anywhere */
  $("#strip").innerHTML = "";
  for (const a of ARTIFACTS) {
    const b = document.createElement("button");
    b.textContent = a.title.replace(/^The /, "");
    b.onclick = () => { setSource("things"); go(ARTIFACTS.indexOf(a)); };
    $("#strip").appendChild(b);
  }
  go(0);
}
function setSource(name) {
  document.querySelectorAll("#src button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.src === name)));
  useSource(name);
}
document.querySelectorAll("#src button").forEach((b) => { b.onclick = () => setSource(b.dataset.src); });
$("#sel").onchange = (e) => go(+e.target.value);

$("#play").onclick = (e) => {
  playing = !playing;
  e.target.setAttribute("aria-pressed", String(playing));
  e.target.textContent = playing ? "❚❚" : "▶";
};
$("#prev").onclick = () => go(i - 1);
$("#next").onclick = () => go(i + 1);
$("#mode").onclick = (e) => {
  mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
  e.target.textContent = mode.toUpperCase();
  paint();
};
$("#cell").oninput = (e) => { cell = +e.target.value; $("#cellv").textContent = cell; paint(); };
$("#em").oninput = (e) => { emerge = +e.target.value / 100; emergeAuto = false;
  $("#auto").setAttribute("aria-pressed", "false"); paint(); };
$("#auto").onclick = (e) => { emergeAuto = !emergeAuto;
  e.target.setAttribute("aria-pressed", String(emergeAuto)); };
addEventListener("resize", () => { sizeCanvas(); paint(); });
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(i + 1);
  else if (e.key === "ArrowLeft") go(i - 1);
  else if (e.key === " ") { e.preventDefault(); $("#play").click(); }
});

setSource("scenes");
console.log(`[textfilm] scenes ${SOURCES.scenes.length} · assets ${SOURCES.assets.length} · ` +
  `things ${SOURCES.things.length} · faces ${SOURCES.faces.length} · manifest ${MF ? "loaded" : "MISSING"}`);
</script>
</body></html>
