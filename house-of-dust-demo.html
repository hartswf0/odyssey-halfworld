<script type="module">

{id:'leaves',text:'OLIVE LEAVES',source:'set-piece.olive-leaf-shelter'},
{id:'roots',text:'OLIVE ROOTS',source:'prop.olive-tree-marriage-bed'}];

function resize(){const r=$('stage').getBoundingClientRect();W=720;H=clamp(Math.round(W*r.height/Math.max(1,r.width)),300,850);off.width=W;off.height=H;canvas.width=W;canvas.height=H;}
addEventListener('resize',resize);resize();

async function moduleFor(id){if(cache.has(id))return cache.get(id);const a=byId.get(id);if(!a)throw Error('Missing asset: '+id);const path=id==='ensemble.people-of-ithaca'?'./assets/ensemble/people-of-ithaca-house.mjs':'.'+a.path;const p=import(path).then(m=>m.default||m.asset||m);cache.set(id,p);try{return await p}catch(e){cache.delete(id);throw e;}}

function sync(){slots.forEach(s=>$(s).value=spec[s]);$('enter').textContent=inside?'Leave the house':'Enter the house';$('hint').textContent=inside?'TAP THE FLOOR TO WALK · MEET AN INHABITANT':'TAP THE GROUND TO WALK · CROSS THE THRESHOLD';buttonState();}
async function assemble(resetActor=false){const token=++version;busy=true;buttonState();message('Assembling this house…');try{
 const [loc,actor,visitor]=await Promise.all([moduleFor(spec.location),moduleFor(spec.inhabitants),moduleFor('character.odysseus')]);if(token!==version)return false;
 const bg=document.createElement('canvas');bg.width=1000;bg.height=700;const c=bg.getContext('2d');c.fillStyle='#f2f0e8';c.fillRect(0,0,1000,700);loc.draw(c,1000,700,{...base(loc),card:false,t:2});

 }catch(e){if(token!==version)return false;busy=false;sync();message('Could not assemble: '+e.message+' · change a selection to retry.');console.error(e);return false;}}
function fill(s,list){$(s).replaceChildren(...list.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.text;return o;}));}
function activeEntry(s){return banks[s].find(x=>x.id===spec[s]);}
function poem(){return ['A HOUSE OF '+activeEntry('material').text,activeEntry('location').text,'USING '+activeEntry('light').text,'INHABITED BY '+activeEntry('inhabitants').text].join('\n');}
function randOther(s){const a=banks[s].filter(x=>x.id!==spec[s]);return a.length?a[Math.floor(Math.random()*a.length)].id:spec[s];}
slots.forEach(s=>$(s).onchange=async()=>{if(!banks||busy)return;recordUndo();spec[s]=$(s).value;await assemble(s==='inhabitants');});
document.querySelectorAll('.lock').forEach(b=>b.onclick=()=>{locks[b.dataset.slot]=!locks[b.dataset.slot];b.setAttribute('aria-pressed',String(locks[b.dataset.slot]));b.textContent=locks[b.dataset.slot]?'held':'lock';});
$('another').onclick=async()=>{recordUndo();const before=spec.inhabitants;for(const s of slots)if(!locks[s])spec[s]=randOther(s);await assemble(before!==spec.inhabitants);};
async function restore(s){spec=clone(s.spec);inside=!!s.inside;player=clone(s.player);chosenState=s.state||0;time=s.time||0;sync();return assemble();}
$('undo').onclick=()=>{const s=undo.pop();if(s)restore(s);};
function setInside(v){inside=v;player.tx=.5;player.ty=v?.81:.94;$('feedback').textContent=v?'You cross the threshold.':'You step back into the world.';sync();}
$('enter').onclick=()=>setInside(!inside);
canvas.onpointerdown=e=>{if(busy||playing)return;const r=canvas.getBoundingClientRect();let x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 if(inside){player.tx=clamp(x,.24,.79);player.ty=clamp(y,.70,.85);}
 else{player.tx=clamp(x,.04,.96);player.ty=.94;}
 $('feedback').textContent='';};
for(const [id,d] of [['left',-1],['right',1]]){const b=$(id);b.onpointerdown=e=>{held=d;b.setPointerCapture(e.pointerId);};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>held=0;}
addEventListener('keydown',e=>{if(/SELECT|INPUT|BUTTON|TEXTAREA/.test(e.target.tagName)||$('dialog').open)return;if(['ArrowLeft','ArrowRight','a','d','e'].includes(e.key)){e.preventDefault();keys.add(e.key);if(e.key==='e'&&!busy&&!playing)setInside(!inside);}});
addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>{keys.clear();held=0;});
function rect(x,y,w,h,fill,stroke=true){og.fillStyle=fill;og.fillRect(x,y,w,h);if(stroke){og.strokeStyle='#24241e';og.lineWidth=2;og.strokeRect(x,y,w,h);}}
function shell(){const x=W*.18,y=H*.30,w=W*.66,h=H*.57;
 // A cutaway enclosure: back wall, two jambs and a roof. Doorway stays clear.
 rect(x,y,w,h,'#ddd9ca');og.save();og.beginPath();og.rect(x+2,y+2,w-4,h-4);og.clip();
 const m=spec.material;
 if(m==='stone'){for(let r=0;r<7;r++)for(let c=-1;c<10;c++)rect(x+c*w/8+(r%2)*w/16,y+r*h/7,w/8-3,h/7-3,(r+c)%3?'#c8c7ba':'#b5b5a8');}
 if(m==='timber'){for(let c=0;c<18;c++){rect(x+c*w/18,y,w/18-3,h,c%2?'#c6bda5':'#d9cfb7');og.strokeStyle='#8a806c';og.beginPath();og.moveTo(x+(c+.4)*w/18,y+12);og.lineTo(x+(c+.6)*w/18,y+h-12);og.stroke();}}
 if(m==='leaves'){for(let r=0;r<9;r++)for(let c=0;c<20;c++){og.fillStyle=(c+r)%2?'#c1c6ac':'#aab799';og.beginPath();og.ellipse(x+c*w/19,y+r*h/8,22,9,-.6,0,Math.PI*2);og.fill();}}
 if(m==='roots'){og.fillStyle='#dfdbc9';og.fillRect(x,y,w,h);for(let i=0;i<22;i++){og.strokeStyle=i%2?'#999078':'#b4aa8e';og.lineWidth=6+i%3;og.beginPath();og.moveTo(x+i*w/22,y+h);og.bezierCurveTo(x+i*w/22+65,y+h*.6,x+i*w/22-60,y+h*.3,x+i*w/22+25,y);og.stroke();}}
 og.restore();rect(x,y+h*.62,w,h*.38,'#e9e4d4');og.strokeStyle='#b2ad9e';og.lineWidth=1;for(let i=0;i<10;i++){og.beginPath();og.moveTo(x+w*.5,y+h*.62);og.lineTo(x+i*w/9,y+h);og.stroke();}
 og.fillStyle='#22221c';og.beginPath();og.moveTo(x-12,y);og.lineTo(x+w*.5,y-H*.11);og.lineTo(x+w+12,y);og.closePath();og.fill();
 rect(x-4,y,13,h,'#807d6b');rect(x+w-9,y,13,h,'#807d6b');rect(x+w*.37,y+h-5,w*.26,8,'#777363');
}
function drawAsset(mod,state,x,y,maxW,maxH,sig){try{const cut=E.inkCutout(mod,state,sig);const s=Math.min(maxW/cut.w,maxH/cut.h),w=cut.w*s,h=cut.h*s;
 og.fillStyle='#0002';og.beginPath();og.ellipse(x,y+2,w*.32,5,0,0,7);og.fill();og.drawImage(cut.cv,cut.x,cut.y,cut.w,cut.h,x-w/2,y-h,w,h);
 }catch(e){if(!reported.has(mod.id)){reported.add(mod.id);message('Drawing unavailable: '+mod.id);console.error(e);}}}
function lighting(t){if(spec.light==='day')return;const x=W*(spec.light==='lamp'?.69:.35),y=H*.71;
 // Screen-space illumination interpretation; applied to shell and bodies together.
 const grad=og.createRadialGradient(x,y,8,x,y,W*.67);grad.addColorStop(0,'rgba(16,16,20,0)');grad.addColorStop(.45,'rgba(16,16,20,.12)');grad.addColorStop(1,'rgba(16,16,20,.65)');og.fillStyle=grad;og.fillRect(0,0,W,H);
 if(spec.light==='hearth'){rect(x-17,y+17,34,7,'#50463a');og.fillStyle='#e9c571';og.beginPath();og.moveTo(x-13,y+17);og.quadraticCurveTo(x-4,y-13-4*Math.sin(t*6),x+2,y-25);og.quadraticCurveTo(x+16,y+6,x+10,y+17);og.fill();}
 else{rect(x-10,y,20,8,'#dac37e');og.strokeStyle='#a38442';og.lineWidth=3;og.beginPath();og.arc(x,y,15,Math.PI,Math.PI*2);og.stroke();og.fillStyle='#fff6cf';og.beginPath();og.ellipse(x,y-7,5,10,0,0,7);og.fill();}}
function dotify(){const src=og.getImageData(0,0,W,H).data,cell=3.2,bs=Array.from({length:10},()=>[]);g.fillStyle='#f2f0e8';g.fillRect(0,0,W,H);
 for(let y=cell/2;y<H;y+=cell)for(let x=cell/2;x<W;x+=cell){const i=(Math.floor(y)*W+Math.floor(x))*4,d=1-(src[i]*.299+src[i+1]*.587+src[i+2]*.114)/255;if(d>.12)bs[Math.min(9,Math.floor(d*10))].push(x,y);}
 g.fillStyle='#202019';for(let k=0;k<10;k++){g.beginPath();const r=(k+1)/10*cell*.57;for(let i=0;i<bs[k].length;i+=2){const x=bs[k][i],y=bs[k][i+1];g.moveTo(x+r,y);g.arc(x,y,r,0,7);}g.fill();}}
function paint(){og.fillStyle='#e2e3d8';og.fillRect(0,0,W,H);if(loaded){og.drawImage(loaded.bg,0,0,W,H);og.fillStyle='#f2f0e85c';og.fillRect(0,0,W,H);}rect(0,H*.87,W,H*.13,'#d4cfb9',false);shell();
 if(loaded){const wide=byId.get(spec.inhabitants).type==='ensemble';drawAsset(loaded.actor,actorState(time),W*.52,H*.80,W*(wide?.49:.22),H*.32,'dust:'+chosenState);

function tick(ms){requestAnimationFrame(tick);const dt=Math.min(.06,(ms-(last||ms))/1000);last=ms;if(!document.hidden&&!busy&&!$('dialog').open){time+=dt;if(!playing){const dir=held+(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);if(dir)player.tx=clamp(player.tx+dir*dt*.28,inside?.24:.04,inside?.79:.96);const d=Math.hypot(player.tx-player.x,player.ty-player.y),v=Math.min(1,dt*.4/Math.max(.0001,d));player.x+=(player.tx-player.x)*v;player.y+=(player.ty-player.y)*v;}

 if(ms-lastPaint>83){lastPaint=ms;paint();}}
function open(title,text){$('title').textContent=title;$('detail').textContent=text;$('links').replaceChildren();$('stateButtons').replaceChildren();if(!$('dialog').open)$('dialog').showModal();}
$('close').onclick=()=>$('dialog').close();
$('meet').onclick=()=>{if(!loaded)return;if(!inside){$('feedback').textContent='Enter the house to meet its inhabitants.';return;}const a=byId.get(spec.inhabitants);open(a.name,(a.perfs?.[0]?.perf||'An inhabitant from the Odyssey atlas.')+'\n\nSelect a state to audition its authored performance.');
 loaded.nodes.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n.key;b.classList.toggle('active',i===chosenState);b.onclick=()=>{recordUndo();chosenState=i;$('dialog').close();$('feedback').textContent=a.name.toLowerCase()+' · '+n.key;};$('stateButtons').append(b);});};
function addLink(label,url){const a=document.createElement('a');a.textContent=label;a.href=url;a.target='_blank';a.rel='noopener';a.style.cssText='display:block;margin:12px 0';$('links').append(a);}
$('sources').onclick=()=>{if(!banks)return;open('The words and their sources',poem()+'\n\nAfter Alison Knowles and James Tenney.\nOdyssey phrases are adapted from this project’s manifest. The four material shells and lighting fields are new procedural interpretations.\n\nPeople of Ithaca uses a scenery-free adapter. Other atlas assets retain their original drawing content. State buttons audition poses; they do not infer motives.');
 for(const s of slots){const e=activeEntry(s),id=e.source||e.id,a=byId.get(id);if(a)addLink(s.toUpperCase()+' · '+a.name,'https://github.com/hartswf0/odyssey-halfworld/blob/main'+a.path);}
 const sc=byId.get(spec.inhabitants).scenes?.[0];addLink('Explore the original game','odyssey-game.html');addLink('Open the Odyssey timeline','odyssey-timeline.html');if(sc)addLink('Audition the source scene','odyssey-synthcine.html#'+sc);};
$('help').onclick=()=>open('Four lines become a place','Change a line to rebuild that part of the house. Hold a line with its lock, then try Another house.\n\nTap the ground to walk, or use the arrow buttons. Enter crosses the threshold. Meet inhabitants exposes their real atlas states.\n\nKeep saves the house, your position and the chosen state. The numbered strip is a timeline. Play visits each saved house for six seconds and stops at the end. Select a number to return. ↓ exports the score as JSON.\n\nEverything here runs without an API key. This is a 2D cutaway prototype of the larger settlement.');
function persist(){try{localStorage.setItem('odyssey.dust.score.v1',JSON.stringify(score));}catch{message('Saved for this session only. Use ↓ to download your score.');}}
function drawScore(){$('cards').replaceChildren(...score.map((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=s.spec.material+' · '+s.spec.inhabitants;b.classList.toggle('active',i===scoreIndex);b.onclick=async()=>{if(busy)return;stop();scoreIndex=i;recordUndo();await restore(s);drawScore();};return b;}));$('clock').textContent=score.length+' houses';$('scrub').max=Math.max(0,score.length-1);$('scrub').value=Math.max(0,scoreIndex);buttonState();}
$('keep').onclick=()=>{if(score.length>=40){message('40 houses saved. Export this score to keep a copy.');return;}score.push(snapshot());scoreIndex=score.length-1;persist();drawScore();message('House '+score.length+' kept in your timeline.');};
function stop(){playing=false;playElapsed=0;$('play').textContent='▶';sync();}
$('play').onclick=async()=>{if(playing){stop();return;}if(!score.length)return;playing=true;scoreIndex=0;playElapsed=0;$('play').textContent='■';await restore(score[0]);drawScore();};
$('scrub').oninput=async()=>{if(busy)return;stop();scoreIndex=+$('scrub').value;await restore(score[scoreIndex]);drawScore();};
