<script type="module">

 * A dwelling is an arrangement of the atlas's actual drawable artifacts.

 {m:'prop.calypsos-loom',l:'location.ogygia-cavern-and-grove',a:'character.calypso'},
 {m:'prop.golden-pitcher-and-silver-basin',l:'location.river-washing-pools',a:'character.nausicaa'},
 {m:'prop.olive-tree-marriage-bed',l:'location.marriage-chamber',a:'character.penelope'},
 {m:'vehicle.odysseuss-raft',l:'location.ogygia-shore',a:'character.odysseus'},
 {m:'prop.travel-wine-jars',l:'location.goat-island-harbor',a:'character.eumaeus'},
 {m:'prop.odysseuss-bow',l:'location.odysseuss-palace-threshold-and-hall',a:'character.telemachus'}];

 try{const ids=[...new Set([spec.location,...nextItems.map(x=>x.id)])],loaded=await Promise.all(ids.map(load));if(ticket!==epoch)return false;
