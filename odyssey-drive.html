<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ODYSSEY DRIVE — the long listen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffd75e'/%3E%3C/svg%3E">
<style>
  :root{--bg:#0a0a0c;--card:#141416;--paper:#f2f1ec;--ink:#141414;--txt:#f2f2ee;
    --dim:rgba(242,242,238,.45);--line:rgba(242,242,238,.16);--gold:#ffd75e;--red:#e0451b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 var(--mono)}
  button,select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);
    padding:8px 12px;cursor:pointer;font-weight:700;letter-spacing:.05em}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.pri{background:var(--gold);color:#141414;border-color:var(--gold);font-weight:900}
  button.on{border-color:var(--gold);color:var(--gold)}
  header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
  .brand{font-weight:900;letter-spacing:.14em}
  .brand i{font-style:normal;color:var(--gold)}
  .chipS{font-size:9px;letter-spacing:.08em;border:1px solid var(--line);padding:4px 8px;color:var(--dim);white-space:nowrap}
  .chipS.ok{border-color:var(--gold);color:var(--gold)}
  .chipS.bad{border-color:var(--red);color:var(--red)}
  #state{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;max-width:34vw}
  a.suiteLn{font-size:10px;letter-spacing:.1em;color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:6px 10px}
  a.suiteLn:hover{color:var(--gold);border-color:var(--gold)}
  main{max-width:1180px;margin:0 auto;padding:14px 14px 130px}
  /* THE FILM — the whole scene, like the suite */
  #stageRow{position:relative}
  #film{display:block;width:100%;aspect-ratio:1120/760;background:#0e0e10;
    border:1px solid var(--line);object-fit:contain}
  #portraitCard{position:absolute;left:12px;bottom:12px;width:clamp(96px,14vw,150px);
    background:var(--paper);border:2px solid #000;box-shadow:0 8px 40px rgba(0,0,0,.7)}
  #portrait{display:block;width:100%;aspect-ratio:3/4}
  #pName{padding:4px 6px;border-top:2px solid #000;color:var(--ink);font-size:8.5px;
    font-weight:900;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #textCol{margin-top:14px}
  #whereRow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  #speaker{font-size:clamp(18px,3.4vw,26px);font-weight:900;letter-spacing:.06em;color:var(--gold);display:inline}
  #cue{font-size:11px;color:var(--dim);margin:2px 0 10px;letter-spacing:.06em;min-height:15px}
  #line{font-size:clamp(18px,3vw,26px);line-height:1.55;font-weight:600;min-height:90px}
  #line.dirOnly{color:var(--dim);font-style:italic;font-size:clamp(14px,2.2vw,19px)}
  #nextUp{margin-top:16px;font-size:11.5px;color:var(--dim);line-height:1.6;border-left:2px solid var(--line);
    padding-left:10px;max-width:60ch}
  #nextUp b{color:var(--txt)}
  /* transport */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,12,.94);
    border-top:1px solid var(--line);backdrop-filter:blur(6px);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  #barIn{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #playBtn{min-width:130px;min-height:52px;font-size:15px}
  #bar button{min-height:52px}
  #prog{flex:1;min-width:130px;height:6px;background:#222;cursor:pointer;position:relative}
  #prog i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
  #posTxt{font-size:10px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
  /* voices panel */
  #voxPanel{position:fixed;right:8px;top:56px;z-index:40;width:min(94vw,360px);background:var(--card);
    border:1px solid var(--gold);padding:12px;display:none;max-height:70vh;overflow-y:auto}
  #voxPanel h3{font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}
  .vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:6px;align-items:center;
    padding:5px 0;border-bottom:1px solid var(--line);font-size:11px}
  .vrow select{width:100%;padding:6px;font-size:10px;background:var(--bg)}
  /* ONE TAP TO SOUND — the gate that guarantees a user gesture */
  #gate{position:fixed;inset:0;z-index:100;background:rgba(10,10,12,.96);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
  #gate button{font-size:19px;padding:22px 34px;min-height:72px}
  #gate .g2{font-size:11px;color:var(--dim);max-width:44ch;line-height:1.7}
  #gateErr{color:var(--red);font-size:12px;max-width:46ch;line-height:1.6;display:none}
  /* THEATRE — the whole screen is the film, the line is the subtitle */
  body.theatre header,body.theatre #textCol #nextUp,body.theatre #whereRow,body.theatre #cue{display:none}
  body.theatre main{max-width:none;padding:0}
  body.theatre #film{position:fixed;inset:0;width:100vw;height:100dvh;border:none;z-index:1}
  body.theatre #portraitCard{position:fixed;left:14px;bottom:110px;z-index:5}
  body.theatre #textCol{position:fixed;left:6%;right:6%;bottom:120px;z-index:5;text-align:center;margin:0}
  body.theatre #line{text-shadow:0 2px 10px #000,0 0 3px #000;min-height:0}
  body.theatre #bar{opacity:0;transition:opacity .3s;pointer-events:none}
  body.theatre.ctl #bar{opacity:1;pointer-events:auto}
  @media(max-width:760px){ #line{min-height:70px} }
</style>
</head>
<body>
<header>
  <div class="brand">ODYSSEY <i>DRIVE</i></div>
  <select id="bookSel"></select>
  <button id="voxBtn" title="the cast — recast any voice">VOICES</button>
  <button id="cueBtn2" class="on" title="the narrator names each speaker">CUES</button>
  <button id="thBtn" title="the whole screen is the film">THEATRE</button>
  <span class="chipS" id="chipBed">♪ bed</span>
  <span class="chipS" id="chipVox">🗣 voice</span>
  <a class="suiteLn" href="odyssey-suite.html">SUITE ▸</a>
  <span id="state">loading…</span>
</header>
<main>
  <div id="stageRow">
    <canvas id="film" width="1456" height="988"></canvas>
    <div id="portraitCard"><canvas id="portrait" width="330" height="440"></canvas>
      <div id="pName"><span id="pnTxt">—</span></div></div>
  </div>
  <section id="textCol">
    <div id="whereRow">—</div>
    <div><span id="speaker">—</span></div>
    <div id="cue"></div>
    <div id="line">One tap starts the sound. Music under the lines, a breath between them.</div>
    <div id="nextUp"></div>
  </section>
</main>
<div id="voxPanel"></div>
<div id="gate">
  <button class="pri" id="gateBtn">🔊 START THE DRIVE</button>
  <div class="g2">One tap unlocks audio on this device. You will hear the narrator say
    “The Odyssey” — if you don't, the panel below says exactly what is blocked.</div>
  <div id="gateErr"></div>
</div>
<div id="bar"><div id="barIn">
  <button id="playBtn" class="pri">▶ DRIVE</button>
  <button id="prevBtn" title="previous scene">‹ SCENE</button>
  <button id="nextBtn" title="next scene">SCENE ›</button>
  <div id="prog"><i></i></div>
  <span id="posTxt">—</span>
</div></div>
<audio id="audio" preload="auto"></audio>
<audio id="voice" preload="auto"></audio>

<script type="module">
import { inkCutout, renderScene } from "./engine/halfworld-engine.mjs";
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const __mem={};
function safeSet(k,v){try{localStorage.setItem(k,v);return true;}
  catch(e){try{localStorage.removeItem("odyssey.suite.dur");localStorage.setItem(k,v);return true;}
  catch(_){__mem[k]=v;return false;}}}
function safeGet(k){return (k in __mem)?__mem[k]:localStorage.getItem(k);}
const LS=(k,d)=>{try{return JSON.parse(safeGet(k))??d;}catch(e){return d;}};
const save=(k,v)=>safeSet(k,JSON.stringify(v));
const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV",
  "XVI","XVII","XVIII","XIX","XX","XXI","XXII","XXIII","XXIV"];

const [SCRIPT,SPOKENJ,AL,MAN,VOICEMAN]=await Promise.all([
  fetch("drive/drive-script.json").then(r=>r.json()),
  fetch("viewer/spoken-lines.json").then(r=>r.json()).catch(()=>({lines:{}})),
  fetch("audio/albums.json").then(r=>r.json()),
  fetch("viewer/odyssey-manifest.json").then(r=>r.json()),
  fetch("drive/voice-manifest.json").then(r=>r.json()).catch(()=>({})),
]);
const SPOKEN=SPOKENJ.lines||{};
const assetById=new Map(MAN.assets.map(a=>[a.id,a]));
const sceneById=new Map(MAN.scenes.map(s=>[s.id,s]));
const SCENES=SCRIPT.scenes;
const BOOKS=[...new Set(SCENES.map(s=>s.book))].sort((a,b)=>a-b);

/* ── music bed ── */
const audio=$("audio");
const MAP=LS("odyssey.suite.map",{});
function trackFor(book){
  const m=MAP[book];
  if(m){const a=AL.albums.find(x=>x.id===m.album);const t=a&&a.tracks.find(t=>t.file===m.track);
    if(t)return {a,t};}
  for(const a of AL.albums){const t=a.tracks.find(t=>t.num===book);if(t)return {a,t};}
  const a=AL.albums[0];return {a,t:a.tracks[(book-1)%a.tracks.length]};
}
let curBook=0, DUCK={target:.7};
function bookBed(book){
  if(book===curBook)return; curBook=book;
  const {a,t}=trackFor(book);
  audio.src=a.dir+"/"+encodeURIComponent(t.file);
  audio.loop=true; audio.volume=Math.min(audio.volume||.25,.25);
  if(running)audio.play().catch(()=>{});
}
setInterval(()=>{const v=audio.volume,t=DUCK.target;
  if(Math.abs(v-t)>.01)audio.volume=Math.max(0,Math.min(1,v+(t-v)*.18));},90);
audio.addEventListener("playing",()=>{$("chipBed").className="chipS ok";
  $("chipBed").textContent="♪ "+decodeURIComponent(audio.src.split("/").pop()).split(" - ").slice(1,2).join("").slice(0,22);});
audio.addEventListener("pause",()=>{$("chipBed").className="chipS";});
audio.addEventListener("error",()=>{$("chipBed").className="chipS bad";$("chipBed").textContent="♪ track failed";});

/* ── voice pool + cast ── */
const GOOD=/Samantha|Ava|Allison|Susan|Zoe|Nicky|Daniel|Oliver|Serena|Moira|Karen|Tessa|Rishi|Fiona|Alex$|Aaron|Arthur|Martha|Catherine|Google (US|UK)/i;
const BAD=/eSpeak|compact|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Zarvox|Trinoids|Whisper|Deranged|Junior|Ralph|Fred|Kathy|Organ|Superstar|Jester|Grandma|Grandpa|Rocko|Shelley|Sandy|Eddy|Flo|Reed/i;
let POOL=[];
function rankVoices(){
  const all=speechSynthesis.getVoices()||[];
  const en=all.filter(v=>/^en/i.test(v.lang));
  const vs=en.filter(v=>!BAD.test(v.name));
  POOL=(vs.length?vs:en).sort((a,b)=>
    ((GOOD.test(b.name)?2:0)+(b.localService?1:0))-((GOOD.test(a.name)?2:0)+(a.localService?1:0)));
}
rankVoices(); speechSynthesis.onvoiceschanged=rankVoices;
setInterval(()=>{try{if(speechSynthesis.speaking&&speechSynthesis.paused)speechSynthesis.resume();}catch(e){}},2500);
const vhash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h;};
const CASTLS=LS("odyssey.drive.cast",{});
const pitchFor=id=>id==="PERFORMER.NARRATOR"?.96:.8+((vhash(id)%36)/100);
const rateFor=id=>id==="PERFORMER.NARRATOR"?.93:.93+((vhash(id+"r")%10)/100);
function castFor(spId){
  if(!POOL.length)return {voice:null,pitch:pitchFor(spId),rate:rateFor(spId)};
  if(CASTLS[spId]){const v=POOL.find(v=>v.name===CASTLS[spId]);
    if(v)return {voice:v,pitch:pitchFor(spId),rate:rateFor(spId)};}
  const v=spId==="PERFORMER.NARRATOR"?POOL[0]
    :POOL[1+(vhash(spId)%(Math.max(1,Math.min(POOL.length-1,7))))]||POOL[0];
  return {voice:v,pitch:pitchFor(spId),rate:rateFor(spId)};
}

/* ── speech engine with a WATCHDOG: silence is detected, reported, retried ── */
let speechOK=null; /* null unknown · true proven aloud · false blocked */
function voxChip(){
  const c=$("chipVox");
  if(speechOK===true){c.className="chipS ok";c.textContent="🗣 "+((castFor("PERFORMER.NARRATOR").voice||{}).name||"default").slice(0,16);}
  else if(speechOK===false){c.className="chipS bad";c.textContent="🗣 BLOCKED — tap VOICES";}
  else {c.className="chipS";c.textContent="🗣 voice";}
}
function speakOnce(text,{voice,pitch=1,rate=.95,volume=1}={}){
  /* resolves {ok,ms}: ok=true only if the utterance actually STARTED */
  return new Promise(res=>{
    let started=false,t0=performance.now(),settled=false;
    const finish=ok=>{if(settled)return;settled=true;res({ok,ms:performance.now()-t0});};
    const u=new SpeechSynthesisUtterance(text);
    if(voice)u.voice=voice;
    u.pitch=pitch;u.rate=rate;u.volume=volume;
    u.onstart=()=>{started=true;};
    u.onend=()=>finish(started);
    u.onerror=()=>finish(false);
    const est=Math.max(3000,text.length*95/rate);
    setTimeout(()=>{if(!settled){try{speechSynthesis.cancel();}catch(e){}finish(started);}},est*2.2+3000);
    try{speechSynthesis.speak(u);speechSynthesis.resume();}catch(e){finish(false);}
  });
}
function chunks(text){
  const parts=String(text).replace(/\s+/g," ").trim().match(/[^.!?…]+[.!?…]*/g)||[String(text)];
  const out=[];let buf="";
  for(const p of parts){ if((buf+p).length>200){if(buf)out.push(buf);buf=p;} else buf+=p; }
  if(buf.trim())out.push(buf);
  return out.map(s=>s.trim()).filter(Boolean);
}
let CUES_ON=LS("odyssey.drive.cues",true), pace=1, running=false;
async function speakSeg(seg){
  const text=segText(seg); if(!text)return;
  const quiet=seg.kind==="SPEAKER_CUE";
  if(quiet&&!CUES_ON)return;
  const cast=castFor(seg.speakerId||"PERFORMER.NARRATOR");
  DUCK.target=.16;
  for(const c of chunks(text)){
    if(!running)break;
    let r=await speakOnce(c,{voice:cast.voice,pitch:cast.pitch,volume:quiet?.6:1,
      rate:(quiet?cast.rate*1.12:cast.rate)*pace});
    if(!r.ok){ /* retry once with the browser default voice */
      try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}
      r=await speakOnce(c,{voice:null,pitch:1,rate:.95*pace,volume:quiet?.6:1});
    }
    if(r.ok&&speechOK!==true){speechOK=true;voxChip();}
    if(!r.ok&&speechOK!==false){speechOK=false;voxChip();
      $("state").textContent="SPEECH BLOCKED — reading continues on screen";}
    if(running)await sleep(140);
  }
  DUCK.target=.7;
}

/* ── words: OUR authored lines first ── */
function segText(seg){
  if(seg.kind==="DIALOGUE"&&seg.sourceTurnId&&SPOKEN[seg.sourceTurnId]&&SPOKEN[seg.sourceTurnId].line)
    return SPOKEN[seg.sourceTurnId].line;
  return seg.text||"";
}
const segDir=seg=>(seg.sourceTurnId&&SPOKEN[seg.sourceTurnId]&&SPOKEN[seg.sourceTurnId].direction)||"";

/* ── THE FILM: the scene itself renders, advancing with the spoken score ── */
const modCache=new Map(), portraitCache=new Map();
let filmToken=0;
async function imp(path){const p=String(path).replace(/^\//,"./");
  if(modCache.has(p))return modCache.get(p);
  const m=await import(p);const mod=m.default||m.asset||m.scene||m;modCache.set(p,mod);return mod;}
async function drawFilm(sc,gi){
  const token=++filmToken;
  const entry=sceneById.get(sc.id); if(!entry)return;
  try{
    const mod=await imp(entry.path);
    if(token!==filmToken)return;
    const cv=$("film");
    const t=(gi/Math.max(1,sc.segments.length))*(mod.duration||36);
    renderScene(cv,mod,{pipeline:"MESH",t,DPR:1.3,card:false});
  }catch(e){}
}
async function drawPortrait(spId,name){
  const cv=$("portrait"),g=cv.getContext("2d");
  g.fillStyle="#f2f1ec";g.fillRect(0,0,cv.width,cv.height);
  $("pnTxt").textContent=name||"—";
  const a=assetById.get(spId);
  if(!a){g.fillStyle="#141414";
    for(let i=0;i<3;i++)for(let j=0;j<3;j++){g.beginPath();
      g.arc(cv.width/2+(i-1)*34,cv.height/2+(j-1)*34,(i===1&&j===1)?15:8,0,7);g.fill();}
    return;}
  try{
    let cut=portraitCache.get(spId);
    if(!cut){const mod=await imp(a.path);cut=inkCutout(mod,{},"drive",.895);portraitCache.set(spId,cut);}
    const s=Math.min(cv.width*.86/cut.w,cv.height*.86/cut.h);
    g.drawImage(cut.cv,cut.x,cut.y,cut.w,cut.h,
      (cv.width-cut.w*s)/2,(cv.height-cut.h*s)/2,cut.w*s,cut.h*s);
  }catch(e){}
}

/* ── render the moment ── */
function renderSeg(sc,seg,gi){
  $("whereRow").textContent="BOOK "+ROMAN[sc.book]+" · "+sc.bookTitle+" — "+sc.title;
  const isDia=seg.kind==="DIALOGUE";
  $("speaker").textContent=(seg.kind==="SPEAKER_CUE"||seg.kind==="SCENE_HEADER")?"":(seg.speakerName||"");
  $("cue").textContent=isDia?segDir(seg):(seg.kind.replace(/_/g," ").toLowerCase());
  const el=$("line");
  el.classList.toggle("dirOnly",!isDia&&seg.kind!=="SCENE_HEADER");
  el.textContent=segText(seg)||"…";
  if(seg.kind!=="SPEAKER_CUE")drawPortrait(seg.speakerId,seg.speakerName);
  drawFilm(sc,gi);
  const nxt=sc.segments.slice(gi+1).find(x=>x.kind==="DIALOGUE");
  $("nextUp").innerHTML=nxt?("next · <b>"+nxt.speakerName+"</b> — "+(segText(nxt)||"").slice(0,90)+"…"):"";
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({
      title:sc.title+" · "+(seg.speakerName||""),
      artist:"ODYSSEY DRIVE · Book "+ROMAN[sc.book],album:sc.bookTitle});
  }
}

/* ── PERFORMED AUDIO: studio-rendered scene files with segment-synced captions ── */
const voiceEl=$("voice");
const inVoice=(t,vm)=>{for(const s of vm.segments){if(t>=s.start&&t<s.start+s.dur)return true;}return false;};
function playSceneVoice(sc,vm,token,fromGi){
  return new Promise(res=>{
    let lastGi=-1,settled=false;
    const iv=setInterval(()=>{
      if(settled)return;
      if(!running||token!==runToken){cleanup();return res("stop");}
      const t=voiceEl.currentTime;
      let cs=null;for(const s of vm.segments){if(t>=s.start-.05)cs=s;else break;}
      if(cs&&cs.gi!==lastGi){lastGi=cs.gi;
        cur={si:SCENES.indexOf(sc),gi:cs.gi};savePos();updateProg();
        renderSeg(sc,sc.segments[cs.gi],cs.gi);}
      DUCK.target=voiceEl.paused?.7:(inVoice(t,vm)?.16:.45);
    },160);
    const cleanup=()=>{settled=true;clearInterval(iv);voiceEl.onended=null;voiceEl.onerror=null;
      voiceEl.pause();DUCK.target=.7;};
    voiceEl.onended=()=>{cleanup();res("done");};
    voiceEl.onerror=()=>{cleanup();res("err");};
    voiceEl.src=vm.file;
    const startAt=((vm.segments.find(s=>s.gi>=fromGi))||{start:0}).start;
    const seek=()=>{try{voiceEl.currentTime=startAt;}catch(e){}
      voiceEl.play().then(()=>{$("chipVox").className="chipS ok";
        $("chipVox").textContent="🗣 PERFORMED · studio cast";},
        ()=>{cleanup();res("err");});};
    if(voiceEl.readyState>=1)seek();else voiceEl.onloadedmetadata=seek;
  });
}

/* ── the drive loop ── */
let cur=LS("odyssey.drive.pos",{si:0,gi:0}), runToken=0, wake=null;
function savePos(){save("odyssey.drive.pos",cur);}
function updateProg(){
  $("prog").querySelector("i").style.width=((cur.si+1)/SCENES.length*100)+"%";
  const sc=SCENES[cur.si];
  $("posTxt").textContent="scene "+(cur.si+1)+"/"+SCENES.length+" · seg "+(cur.gi+1)+"/"+(sc?sc.segments.length:0);
}
async function drive(){
  const token=++runToken; running=true;
  $("playBtn").textContent="❚❚ PAUSE";
  if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>wake=l).catch(()=>{});
  audio.play().catch(()=>{});
  for(let si=cur.si;si<SCENES.length;si++){
    const sc=SCENES[si];
    bookBed(sc.book); $("bookSel").value=sc.book;
    const fromGi=(si===cur.si?cur.gi:0);
    const vm=VOICEMAN[sc.id];
    let played=false;
    if(vm){ /* the studio-performed scene file, captions synced to its clock */
      const r=await playSceneVoice(sc,vm,token,fromGi);
      if(r==="stop"||!running||token!==runToken)return;
      played=(r==="done");
    }
    if(!played){ /* no file (or it failed): live synthesis reads the score */
      for(let gi=fromGi;gi<sc.segments.length;gi++){
        if(!running||token!==runToken)return;
        cur={si,gi};savePos();updateProg();
        const seg=sc.segments[gi];
        renderSeg(sc,seg,gi);
        await speakSeg(seg);
        if(!running||token!==runToken)return;
        await sleep(Math.min(1400,(seg.pauseAfterMs||260))/pace);
      }
    }
    if(running&&token===runToken){DUCK.target=.85;await sleep(2400);DUCK.target=.7;}
    cur={si:si+1,gi:0};savePos();
  }
  running=false;$("playBtn").textContent="▶ DRIVE";
  $("state").textContent="THE POEM IS COMPLETE";
}
function stop(){running=false;runToken++;try{speechSynthesis.cancel();}catch(e){}
  audio.pause();voiceEl.pause();$("playBtn").textContent="▶ DRIVE";
  if(wake){wake.release().catch(()=>{});wake=null;}}
$("playBtn").onclick=()=>{running?stop():drive();};
function jumpScene(d){
  const was=running;stop();
  cur={si:Math.max(0,Math.min(SCENES.length-1,cur.si+d)),gi:0};savePos();updateProg();
  const sc=SCENES[cur.si];renderSeg(sc,sc.segments[0],0);
  if(was)drive();
}
$("prevBtn").onclick=()=>jumpScene(-1);
$("nextBtn").onclick=()=>jumpScene(1);
$("prog").onclick=e=>{
  const r=$("prog").getBoundingClientRect();
  const si=Math.max(0,Math.min(SCENES.length-1,Math.floor((e.clientX-r.left)/r.width*SCENES.length)));
  const was=running;stop();cur={si,gi:0};savePos();updateProg();
  renderSeg(SCENES[si],SCENES[si].segments[0],0);
  if(was)drive();
};
if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",()=>{if(!running)drive();});
  navigator.mediaSession.setActionHandler("pause",()=>{if(running)stop();});
  navigator.mediaSession.setActionHandler("nexttrack",()=>jumpScene(1));
  navigator.mediaSession.setActionHandler("previoustrack",()=>jumpScene(-1));
}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&running&&navigator.wakeLock)
    navigator.wakeLock.request("screen").then(l=>wake=l).catch(()=>{});
});

/* ── THE GATE: one tap = audio unlocked, speech PROVEN aloud, drive begins ── */
$("gateBtn").onclick=async()=>{
  $("gateBtn").textContent="…";
  audio.play().catch(()=>{});               /* gesture unlocks the bed */
  const sc0=SCENES[cur.si], vm0=sc0&&VOICEMAN[sc0.id];
  if(vm0){
    /* unlock the voice channel with the REAL first file, inside this gesture
       (play() with no src hangs forever in Chrome — never blip an empty element) */
    voiceEl.src=vm0.file; voiceEl.play().catch(()=>{});
    $("gate").remove(); drive(); return;
  }
  rankVoices();
  const nar=castFor("PERFORMER.NARRATOR");
  let r=await speakOnce("The Odyssey.",{voice:nar.voice,pitch:nar.pitch,rate:nar.rate});
  if(!r.ok)r=await speakOnce("The Odyssey.",{voice:null});   /* default voice */
  speechOK=r.ok; voxChip();
  if(!r.ok){
    const e=$("gateErr"); e.style.display="block";
    e.textContent="Speech synthesis did not start. On iPhone: Settings → Accessibility → Spoken Content → Voices to install a voice, and turn off Silent Mode. On Mac: System Settings → Accessibility → Spoken Content. Music and on-screen reading still run.";
    $("gateBtn").textContent="▶ DRIVE ANYWAY";
    $("gateBtn").onclick=()=>{$("gate").remove();drive();};
    return;
  }
  $("gate").remove();
  drive();
};

/* ── theatre: the whole screen is the film ── */
let thIdle=null;
$("thBtn").onclick=()=>{
  const on=document.body.classList.toggle("theatre");
  $("thBtn").classList.toggle("on",on);
  if(on&&document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
  if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});
};
document.addEventListener("pointerdown",()=>{
  if(!document.body.classList.contains("theatre"))return;
  document.body.classList.add("ctl");
  clearTimeout(thIdle);thIdle=setTimeout(()=>document.body.classList.remove("ctl"),2800);
});
addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("theatre"))$("thBtn").onclick();});

/* ── header controls ── */
$("bookSel").innerHTML=BOOKS.map(b=>`<option value="${b}">BOOK ${ROMAN[b]}</option>`).join("");
$("bookSel").onchange=e=>{
  const si=SCENES.findIndex(s=>s.book===+e.target.value);
  if(si<0)return;const was=running;stop();cur={si,gi:0};savePos();updateProg();
  renderSeg(SCENES[si],SCENES[si].segments[0],0);
  if(was)drive();
};
$("cueBtn2").onclick=()=>{CUES_ON=!CUES_ON;save("odyssey.drive.cues",CUES_ON);
  $("cueBtn2").classList.toggle("on",CUES_ON);};
$("cueBtn2").classList.toggle("on",CUES_ON);
$("voxBtn").onclick=()=>{
  const p=$("voxPanel");
  if(p.style.display==="block"){p.style.display="none";return;}
  rankVoices();
  const speakers=new Map();
  SCENES.forEach(s=>s.segments.forEach(g=>{
    if(g.kind==="DIALOGUE"||g.speakerId==="PERFORMER.NARRATOR")speakers.set(g.speakerId,g.speakerName);}));
  let h='<h3>THE CAST · '+POOL.length+' voices pass the quality bar on this device</h3>';
  if(!POOL.length)h+='<div style="font-size:11px;color:var(--red);line-height:1.6;margin-bottom:8px">No usable English voices found. Install voices in your system accessibility settings, then reopen this panel.</div>';
  [...speakers.entries()].slice(0,40).forEach(([id,nm])=>{
    const cast=castFor(id);
    h+='<div class="vrow"><span>'+nm+'</span><select data-sp="'+id+'">'
      +POOL.map(v=>'<option'+(cast.voice&&cast.voice.name===v.name?" selected":"")+'>'+v.name+'</option>').join("")
      +'</select></div>';});
  p.innerHTML=h;p.style.display="block";
  p.querySelectorAll("select").forEach(sel=>{
    sel.onchange=async()=>{CASTLS[sel.dataset.sp]=sel.value;save("odyssey.drive.cast",CASTLS);
      const v=POOL.find(v=>v.name===sel.value);
      const r=await speakOnce("So speaks "+(speakers.get(sel.dataset.sp)||"the voice")+".",
        {voice:v,pitch:pitchFor(sel.dataset.sp),rate:rateFor(sel.dataset.sp)});
      speechOK=r.ok;voxChip();};
  });
};

/* boot */
const b0=new URLSearchParams(location.search).get("b");
if(b0){const si=SCENES.findIndex(s=>s.book===+b0);if(si>=0)cur={si,gi:0};}
updateProg();
{const sc=SCENES[cur.si]||SCENES[0];renderSeg(sc,sc.segments[cur.gi]||sc.segments[0],cur.gi||0);}
voxChip();
$("state").textContent=SCENES.length+" scenes · "+Object.keys(VOICEMAN).length+" studio-performed · "
  +Object.keys(SPOKEN).length+" authored lines";
if(Object.keys(VOICEMAN).length){$("chipVox").className="chipS ok";
  $("chipVox").textContent="🗣 "+Object.keys(VOICEMAN).length+" scenes performed";}
window.__drive={get cur(){return cur},SCENES,drive,stop,jumpScene,castFor,segText,speakOnce,
  get running(){return running},get speechOK(){return speechOK}};
</script>
