<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f1e8"><title>House of Dust · Four lines make a dwelling</title><meta name="description" content="A permutation poem that composes an Odyssey household. Change its material, place, light, and inhabitants. Hold a line; cast the others.">
<style>
:root{color-scheme:light;--paper:#f4f1e8;--ink:#201f1b;--line:#c9c5ba;--dim:#746f62;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;display:grid;grid-template-rows:48px minmax(0,1fr) 224px;padding-bottom:env(safe-area-inset-bottom)}
button,select,a{font:inherit;color:inherit;touch-action:manipulation}button,a{cursor:pointer}button{border:1px solid var(--line);border-radius:0;background:var(--paper);min-height:36px;padding:6px 10px;font-size:11px}button:hover{border-color:var(--ink)}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid #923d27;outline-offset:-2px}a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:12px;padding:5px 14px;border-bottom:1px solid var(--line);min-width:0}h1{font:normal 23px Georgia,serif;margin:0;white-space:nowrap}header small{font-size:8px;letter-spacing:.11em;color:var(--dim);flex:1}#cast{margin-left:auto;background:var(--ink);color:var(--paper);font-size:13px;min-width:90px}
main{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 27px}
#stage{position:relative;overflow:hidden;min-width:0;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.camera{position:absolute;top:9px;right:10px;display:flex;gap:5px}.camera button{font-size:10px;min-height:32px;padding:5px 8px;background:rgba(244,241,232,.95)}
.focusbar{position:absolute;top:9px;left:10px;right:150px;display:flex;gap:7px;align-items:center;min-width:0}.focusbar select{max-width:135px;min-width:50px;min-height:34px;background:var(--paper);font-size:11px}.focusbar span{max-width:300px;font:16px Georgia,serif;background:var(--paper)}
#return{min-height:32px;font-size:10px}
.caption{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:3px 12px;overflow:hidden;min-width:0}
#status{margin:0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#retry{font-size:9px;min-height:22px;padding:2px 6px;flex:none}
footer{padding:4px max(12px,calc((100vw - 900px)/2));display:grid;grid-template-rows:repeat(4,minmax(0,1fr)) 35px;min-width:0;border-top:1px solid var(--ink)}
.line{display:grid;grid-template-columns:minmax(0,1fr) 48px;align-items:center;border-bottom:1px solid var(--line);min-height:0;gap:9px}
.line label{position:relative;display:flex;gap:12px;align-items:baseline;min-width:0;padding:3px 0;cursor:pointer}
.line small{font-size:9px;letter-spacing:.08em;color:var(--dim);width:110px;flex:none}
.line span{font:normal 19px/1.05 Georgia,serif;min-width:0}
.line select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.line button{border:0;min-height:34px;padding:4px;font-size:10px;color:var(--dim)}
.line button[aria-pressed=true]{color:var(--ink);background:#ded8c8;text-decoration:underline;text-underline-offset:4px}
.foottools{display:flex;gap:14px;align-items:center;min-width:0;font-size:10px}.foottools button{border:0;min-height:30px;padding:3px 0;font-size:10px}.foottools a{font-size:10px}.foottools .credit{margin-left:auto;color:var(--dim);font-size:8px;letter-spacing:.08em}
@media(max-width:600px){
 body{grid-template-rows:46px minmax(0,1fr) 223px}
 header{gap:7px;padding:5px 10px}h1{font-size:22px}header small{display:none}#cast{min-width:89px}
 footer{padding:3px 12px 2px;grid-template-rows:repeat(4,minmax(0,1fr)) 34px}
 .line label{display:block;padding:3px 0}.line small{display:block;width:auto;font-size:8px;line-height:11px;margin-bottom:2px}.line span{font-size:14px;line-height:15px;display:block}
 .line button{font-size:9px}.foottools{gap:13px}.foottools .credit{font-size:7px;letter-spacing:0}
 .focusbar{right:10px;top:48px}.focusbar span{font-size:13px}.caption{padding:3px 10px}#status{font-size:9px}
}
@media(max-height:480px) and (min-width:601px){
 body{grid-template-columns:minmax(0,1fr) 310px;grid-template-rows:42px minmax(0,1fr)}
 header{grid-column:1 / -1}main{grid-row:2;grid-column:1}footer{grid-row:2;grid-column:2;border-top:0;border-left:1px solid var(--ink);padding:5px 10px;grid-template-rows:repeat(4,minmax(0,1fr)) 38px}
 .line label{display:block}.line small{display:block;font-size:8px;width:auto;margin-bottom:4px}.line span{font-size:15px}.foottools{gap:11px;flex-wrap:wrap;align-content:center}.foottools .credit{display:none}h1{font-size:20px}header small{font-size:7px}
 .focusbar{right:10px;top:45px}.focusbar span{font-size:12px}
}
</style></head><body data-ready="false">
<header><h1>House of Dust</h1><small>AFTER KNOWLES + TENNEY · ODYSSEY</small><button id="cast">Cast ↻</button></header>
<main><div id="stage"><canvas id="world" aria-label="The dwelling composed by the four lines. Drag to look around. Tap an object or use Things to inspect."></canvas>
<div class="camera"><button id="view" title="Change the camera distance">Near</button><button id="things">Things</button></div>
<div class="focusbar"><button id="return" hidden>← Dwelling</button><span id="focusName" hidden></span><select id="inspect" aria-label="Drawing state" hidden></select></div></div>
<div class="caption"><p id="status" role="status">Opening the drawings…</p><button id="retry" hidden>Retry</button></div></main>
<footer aria-label="Four lines compose the dwelling">
<div class="line"><label for="matter"><small>A HOUSE OF</small><span id="word-matter"></span><select id="matter" aria-label="House material"></select></label><button id="hold-matter" aria-label="Hold matter" aria-pressed="false">Hold</button></div>
<div class="line"><label for="place"><small>PLACE</small><span id="word-place"></span><select id="place" aria-label="Place"></select></label><button id="hold-place" aria-label="Hold place" aria-pressed="false">Hold</button></div>
<div class="line"><label for="light"><small>USING</small><span id="word-light"></span><select id="light" aria-label="Light"></select></label><button id="hold-light" aria-label="Hold light" aria-pressed="false">Hold</button></div>
<div class="line"><label for="people"><small>INHABITED BY</small><span id="word-people"></span><select id="people" aria-label="Inhabitants"></select></label><button id="hold-people" aria-label="Hold people" aria-pressed="false">Hold</button></div>
<div class="foottools"><button id="play">Pause</button><button id="undo">Previous</button><button id="share">Link</button><a id="atlas" href="./house-of-dust-atlas.html">Atlas ↗</a><a href="https://github.com/hartswf0/odyssey-halfworld/blob/main/house-of-dust-score.mjs" target="_blank" rel="noopener">Code ↗</a><span class="credit">HOLD A LINE · CAST THE REST</span></div>
</footer><script type="module" src="./house-of-dust-program.mjs"></script></body></html>
