<html lang="en">
<head>

<title>House of Dust · Explore the Odyssey</title>
<meta name="description" content="Enter the Odyssey's authored scenes. Explore its pitchers, bowls, lyres, looms and rooted bed. Operate their states and hear the inhabitants perform.">
<style>

button{background:var(--paper);border:1px solid var(--line);min-width:36px;min-height:40px;padding:6px 10px;border-radius:2px}
button:hover{border-color:var(--ink)}button:disabled{opacity:.35;cursor:default}button[aria-pressed=true]{border-color:var(--blue);color:var(--blue)}
a{color:var(--blue);text-decoration:none}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
header{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 10px;min-width:0;font-size:11px}
.home{width:36px;flex:none;text-align:center;color:var(--ink);font-size:19px}

#book{width:95px;flex:none}#scene{flex:1}header button{min-height:38px;padding:4px 10px}
#viewport{position:relative;min-width:0;min-height:0;overflow:hidden}
#world{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;top:16px;left:20px;right:20px;pointer-events:none;display:flex;gap:15px;justify-content:space-between;align-items:start}
#eyebrow{font-size:9px;letter-spacing:.18em;background:rgba(244,244,240,.88);padding:3px 0}

.toolbar{display:flex;align-items:center;gap:7px;font-size:10px;min-width:0}
.toolbar button{font-size:11px;white-space:nowrap}#cast{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scrub{display:flex;align-items:center;gap:8px;min-width:45px;flex:1}#timeLabel{font-size:9px;color:var(--dim);white-space:nowrap}
input[type=range]{width:100%;min-width:32px;height:38px;accent-color:var(--ink)}#clock{font-size:9px;min-width:68px;text-align:right;color:var(--dim)}

.shelf>button{align-self:center;min-width:30px;padding:4px;height:40px}

.object span{font-size:9px;line-height:11px;height:22px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

dialog{position:fixed;inset:8px;width:calc(100% - 16px);height:calc(100dvh - 16px);max-width:920px;max-height:none;margin:auto;padding:14px;border:1px solid var(--ink);background:var(--paper);overflow:hidden}

dialog::backdrop{background:rgba(18,18,15,.65)}
.sourcehead{display:flex;gap:7px;align-items:center;min-width:0}.sourcehead h2{font:normal 19px/1.15 Georgia,serif;flex:1;margin:0;max-height:44px;overflow:hidden}
.sourcehead button,.tabs button,.pagination button{font-size:11px}
.tabs{display:flex;gap:7px;align-items:center}.tabs button{flex:1}.tabs span{font-size:10px;color:var(--dim)}
#sourceText{font:12px/19px ui-monospace,monospace;white-space:pre;overflow:hidden;margin:0;min-height:0;min-width:0;tab-size:2}
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px}.pagination #copySource{margin-left:auto}
@media(max-width:600px){

 .hud{left:12px;right:12px;top:11px;display:block}h1{font-size:21px;max-width:100%;line-height:1.15}
 .focusbar{margin-top:8px;justify-content:flex-start}#states{max-width:155px;min-height:34px}.focusbar button{min-height:34px}
 .notice{left:10px;right:10px;bottom:5px}#status{font-size:10px;max-height:36px}
 footer{padding:0 6px 4px;grid-template-rows:44px minmax(0,1fr)}.toolbar{gap:4px}.toolbar button{font-size:10px;padding:5px 7px}
 #timeLabel,#clock{display:none}.scrub{gap:0;min-width:38px}#room{max-width:82px;white-space:normal;line-height:12px}
 .shelf{gap:3px;grid-template-columns:28px minmax(0,1fr) 28px}.shelf>button{min-width:28px;padding:2px}#rail{gap:3px}
 .object{padding:2px}.object span{font-size:9px}.object canvas{max-height:58px}
 dialog{padding:10px;grid-template-rows:44px 40px minmax(0,1fr) 44px}.sourcehead{gap:3px}.sourcehead button{padding:4px 7px;font-size:10px}.sourcehead h2{font-size:16px}
}
@media(max-height:480px){
 body{grid-template-rows:40px minmax(0,1fr) 96px}header{padding:1px 7px}header button,header select{min-height:34px}
 footer{grid-template-rows:40px minmax(0,1fr)}.toolbar button{min-height:34px}.object canvas{height:29px;max-height:29px}.object span{height:12px;-webkit-line-clamp:1;font-size:8px}
 .hud{top:7px;left:12px;display:flex}h1{font-size:18px}.focusbar{margin-top:0}#eyebrow{font-size:8px}.notice{bottom:2px}#status{font-size:9px;max-height:30px}
}
</style>
</head>
<body data-ready="false">
<header aria-label="Scene navigation">
<a class="home" href="./index.html" aria-label="Odyssey Halfworld home">←</a>
<select id="book" aria-label="Book" data-nav></select><select id="scene" aria-label="Scene" data-nav></select>
<button id="scenePrev" aria-label="Previous scene" data-nav>‹</button><button id="sceneNext" aria-label="Next scene" data-nav>›</button>
<button id="sources" aria-label="Score, prompts and source code">Source</button>
</header>
<main id="viewport" aria-label="Explore the scene">
<canvas id="world" width="1120" height="760" aria-label="Odyssey scene. Drag to explore; tap an object to inspect. Arrow keys move the view."></canvas>
<div class="hud"><div><span id="eyebrow">HOUSE OF DUST · ODYSSEY</span><h1 id="title">Opening the Odyssey</h1></div>
<div class="focusbar"><label id="stateLabel" for="states" hidden>STATE</label><select id="states" aria-label="Object state or character emotion" hidden></select><button id="perform" hidden>Perform</button><button id="hear" hidden>Hear voice</button></div></div>
<div class="notice"><p id="status" role="status" aria-live="polite">Opening the atlas…</p><button id="retry" hidden>Retry</button></div>
</main>
<footer>
<div class="toolbar"><button id="back">← Back</button><button id="play" aria-pressed="true">Pause</button>
<label class="scrub"><span id="timeLabel">Scene time</span><input id="time" aria-label="Scene time or object transformation" type="range" min="0" max="1000" value="0"></label><span id="clock"></span>
<button id="room">Whole scene</button><button id="cast" data-nav>Cast ↗</button></div>
<div class="shelf" aria-label="Objects and inhabitants in this scene"><button id="railPrev" aria-label="Previous objects">‹</button><div id="rail"></div><button id="railNext" aria-label="More objects">›</button><span id="count"></span></div>
</footer>
<dialog id="source" aria-label="Score and source">
<div class="sourcehead"><h2 id="sourceTitle">The scene's source</h2><button id="share">Link</button><button id="save">Print</button><button id="sourceClose">Close</button></div>
<div class="tabs"><button data-tab="score">Score</button><button data-tab="prompt">Prompt</button><button data-tab="code">Code</button></div>
<pre id="sourceText"></pre>
<div class="pagination"><button id="sourcePrev" aria-label="Previous source page">‹</button><span id="pageNumber"></span><button id="sourceNext" aria-label="Next source page">›</button><button id="copySource">Copy text</button></div>
</dialog>
<audio id="audio" preload="none"></audio>
<script type="module">
const $=id=>document.getElementById(id), SW=1120,SH=760;
const cv=$("world"),g=cv.getContext("2d");
const field=document.createElement("canvas");field.width=SW;field.height=SH;
const fg=field.getContext("2d",{willReadFrequently:true});
const work=document.createElement("canvas"),wg=work.getContext("2d",{willReadFrequently:true});
const PAPER="#f4f4f0", KEY="odyssey-dust-explore/2";
const canonical=id=>String(id).replace(/^([^.]+)\./,(_,p)=>p.toLowerCase().replace(/_/g,"-")+".");
let E,MF,byId,active=null,selected=null,objects=[],modules=new Map(),busy=false,loadToken=0;
let T=0,playing=!matchMedia("(prefers-reduced-motion: reduce)").matches,dirty=true,last=0,lastDraw=-1;
let camera={x:SW/2,y:SH/2,zoom:1},hits=[],traceHits=[],canvasOwners=new WeakMap();
let stateIndex=0,blend=0,railPage=0,railSize=4,performing=false,artifacts=null,artifact=null;
let renderingScene=false;
let objectToken=0, PERF=null, voiceEnd=Infinity;
const au=$("audio");
let errorText="",sourceTab="score",sourcePage=0,sourceRaw="",sourcePages=[],sourceToken=0;
let activePointer=null,drag=null,ignoreTap=false,history=[];
const SPECIAL={
 "prop.laertess-shroud-and-loom":"shroud","prop.olive-tree-marriage-bed":"bed",
 "prop.odysseuss-bow":"bow","prop.olivewood-stake":"stake",
 "prop.bag-of-winds":"winds","prop.elpenors-oar":"oar","creature.argos":"argos",
 "creature.crew-to-swine-variants":"swine","creature.gold-and-silver-guardian-dogs":"goldenDogs"
};
const NOTES={
 "prop.golden-pitcher-and-silver-basin":"Hospitality begins with water. Carry the pitcher, pour, and wash.",
 "prop.cheese-racks-and-milk-vessels":"The cave is already a household: milk, vessels, racks, and a place to store food.",
 "prop.helens-mixing-bowl":"A bowl changes the telling. Explore the vessel and its authored states.",
 "prop.olive-tree-marriage-bed":"A living tree remains inside the bed. Its construction becomes evidence.",
 "prop.laertess-shroud-and-loom":"Made by day, unmade by night. Move through the loom's states.",
 "prop.foot-washing-basin":"Washing exposes the scar that a disguise cannot conceal.",
 "prop.cave-blocking-stone":"The entrance closes. A household becomes a trap.",
 "prop.odysseuss-bow":"A familiar object tests an unfamiliar man."
};
const START="OD-B01-S04";
function say(text,bad=false){$("retry").hidden=!bad;$("status").textContent=text;$("status").classList.toggle("error",bad);errorText=bad?text:"";}
function option(label,value){const e=document.createElement("option");e.value=value;e.textContent=label;return e;}
function limit(x,a,b){return Math.max(a,Math.min(b,x));}
function delay(p){let id;return Promise.race([p,new Promise((_,reject)=>id=setTimeout(()=>reject(Error("Atlas loading timed out.")),20000))]).finally(()=>clearTimeout(id));}
function setBusy(value){busy=value;document.querySelectorAll("[data-nav]").forEach(e=>e.disabled=value);$("retry").hidden=!errorText;sync();}
function assetEntry(id){return byId.get(canonical(id));}
async function getModule(id){
 id=canonical(id);if(modules.has(id))return modules.get(id);
 const entry=assetEntry(id);if(!entry)throw Error("Unknown atlas asset: "+id);
 const promise=delay(import("./"+entry.path.replace(/^\/+/,""))).then(m=>{
  const mod=m.default||m.asset;if(typeof mod?.draw!=="function")throw Error("Cannot draw "+id);
  // Track the actual source canvases, so hit targets follow authored placement.
  const draw=mod.draw;
  mod.draw=function(ctx,...args){canvasOwners.set(ctx.canvas,id);if(renderingScene&&entry.type==="sound_source")return;return draw.call(this,ctx,...args);};
  return mod;
 }).catch(e=>{modules.delete(id);throw e;});
 modules.set(id,promise);return promise;
}
const originalDrawImage=fg.drawImage.bind(fg);
fg.drawImage=function(source,...args){
 const id=canvasOwners.get(source);
 if(id){
  const d=args.length===8?args.slice(4):args.length===4?args:[args[0],args[1],source.width,source.height];
  const [x,y,w,h]=d,m=fg.getTransform();
  if([x,y,w,h].every(Number.isFinite)){
   const corners=[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].map(([a,b])=>({x:m.a*a+m.c*b+m.e,y:m.b*a+m.d*b+m.f}));
   traceHits.push({id,x:Math.min(...corners.map(p=>p.x)),y:Math.min(...corners.map(p=>p.y)),w:Math.max(...corners.map(p=>p.x))-Math.min(...corners.map(p=>p.x)),h:Math.max(...corners.map(p=>p.y))-Math.min(...corners.map(p=>p.y))});
  }
 }
 return originalDrawImage(source,...args);
};
function sceneItems(entry,mod){
 const ids=[...new Set([...(mod.cast||[]).map(c=>canonical(c.asset)),...(entry.assets||[]).map(canonical)])];
 return ids.filter(id=>assetEntry(id));
}
function readLink(){
 const p=new URLSearchParams(location.hash.slice(1));
 if(p.has("dust")){
  try{const old=JSON.parse(p.get("dust"));const map=["OD-B17-S03","OD-B05-S03","OD-B09-S06","OD-B10-S04","OD-B11-S04","OD-B14-S01","OD-B23-S04","OD-B07-S02","OD-B02-S02"];return {scene:map[old.values?.site]||START};}catch{return {scene:START};}
 }
 return {scene:p.get("scene")||START,object:p.get("object"),state:p.get("state"),time:Number(p.get("t")||0)};
}
function writeLink(){
 if(!active)return;
 const p=new URLSearchParams({scene:active.entry.id});
 if(selected){p.set("object",selected.id);p.set("state",selected.nodes[stateIndex]?.key||"preview");}
 p.set("t",String(Math.round(T*10)/10));
 try{window.history.replaceState(null,"","#"+p);localStorage.setItem(KEY,JSON.stringify({scene:active.entry.id}));}catch{}
}
function sortedObjects(ids){
 const rank=t=>/prop|set_piece/.test(t)?0:/vehicle|creature/.test(t)?1:/character/.test(t)?2:3;
 return ids.map(id=>assetEntry(id)).filter(a=>a.type!=="location").sort((a,b)=>rank(a.type)-rank(b.type));
}
async function openScene(id,{object=null,state=null,time=0,push=true}={}){
 if(!MF)return;const entry=MF.scenes.find(s=>s.id===id);if(!entry){say("This scene is not in the atlas.",true);return;}
 const token=++loadToken;objectToken++;au.pause();setBusy(true);say("Opening "+entry.title.toLowerCase()+"…");
 try{
  const imported=await delay(import("./"+entry.path.replace(/^\/+/,"")));
  const mod=imported.default||imported.scene;
  if(typeof mod?.stage!=="function")throw Error("Scene has no authored stage.");
  const ids=sceneItems(entry,mod);
  await Promise.all(ids.map(getModule));
  let locationId=ids.find(id=>assetEntry(id)?.type==="location"),context=null;
  if(!locationId){
   const earlier=MF.scenes.filter(s=>s.book===entry.book&&s.id<entry.id).reverse();
   locationId=earlier.flatMap(s=>s.assets||[]).map(canonical).find(id=>assetEntry(id)?.type==="location");
   if(!locationId&&entry.book===1)locationId="location.odysseuss-palace-threshold-and-hall";
   if(locationId)context=await getModule(locationId);
  }
  if(token!==loadToken)return;
  const candidate={entry,mod,ids,locationId,context,duration:Math.max(1,mod.duration||30)};
  // Stage into a temporary field before replacing the active scene.
  const test=document.createElement("canvas");test.width=SW;test.height=SH;
  const tg=test.getContext("2d");tg.fillStyle=PAPER;tg.fillRect(0,0,SW,SH);
  if(context)context.draw(tg,SW,SH,{...(context.preview?.()||{}),t:0,card:false});
  renderingScene=true;try{mod.stage(tg,SW,SH,limit(time,0,candidate.duration));}finally{renderingScene=false;}
  if(push&&active)history.push({scene:active.entry.id,object:selected?.id,time:T});
  active=candidate;objects=sortedObjects(ids);selected=null;performing=false;artifact=null;
  T=limit(Number.isFinite(time)?time:0,0,active.duration);railPage=0;camera={x:SW/2,y:SH/2,zoom:innerWidth>=700?0:1};lastDraw=-1;
  rebuildScenes();buildRail();sync();renderScene();
  if(object&&objects.some(a=>a.id===canonical(object)))await selectObject(canonical(object),state);
  else say("Drag to explore. Tap a thing, or choose one below.");
  dirty=true;writeLink();
 }catch(e){if(token===loadToken)say(e.message+" Your previous scene is still available.",true);}
 finally{if(token===loadToken)setBusy(false);}
}
function rebuildScenes(){
 $("book").value=String(active.entry.book);$("scene").replaceChildren();
 for(const s of MF.scenes.filter(s=>s.book===active.entry.book))$("scene").append(option(s.title,s.id));
 $("scene").value=active.entry.id;
}
function currentState(){
 if(!selected)return {};
 const nodes=selected.nodes, a=nodes[stateIndex]?.prev()||selected.mod.preview?.()||{},b=nodes[Math.min(nodes.length-1,stateIndex+1)]?.prev()||a;
 const s={...a};
 for(const key of new Set([...Object.keys(a),...Object.keys(b)])){
  if(typeof a[key]==="number"&&typeof b[key]==="number")s[key]=a[key]+(b[key]-a[key])*blend;
  else if(blend>.5)s[key]=b[key]??a[key];
 }
 return {...s,t:T,card:false};
}
async function selectObject(id,state=null){
 const a=objects.find(a=>a.id===id);if(!a)return;
 const token=++objectToken;au.pause();
 const mod=await getModule(id);if(token!==objectToken)return;
 selected={...a,mod,nodes:E.normStateNodes(mod)};
 if(a.type==="character"){
  try{await loadPerformers();if(token!==objectToken)return;
   const face=faceFor(a.id);if(face){selected.face=face;selected.nodes=[{key:"directed",prev:()=>PERF.DIR.beatEmotion(active.entry.id)||{}},...Object.entries(PERF.DIR.EMOTIONS).map(([key,value])=>({key,prev:()=>({...value})}))];}
  }catch(e){say("Face performance unavailable; showing the atlas figure.",true);}
 }
 if(!selected.nodes.length)selected.nodes=[{key:"preview",prev:()=>mod.preview?.()||{}}];
 stateIndex=Math.max(0,selected.nodes.findIndex(n=>n.key===state));blend=0;performing=false;artifact=null;
 $("states").replaceChildren(...selected.nodes.map((n,i)=>option(n.key.replace(/[_-]/g," "),i)));
 $("states").value=String(stateIndex);$("time").value=0;
 railPage=Math.floor(objects.findIndex(a=>a.id===id)/railSize);
 buildRail();sync();dirty=true;writeLink();
 say(NOTES[id]||"Explore the original drawing and its "+selected.nodes.length+" authored state"+(selected.nodes.length===1?"":"s")+".");
}
function returnScene(){au.pause();objectToken++;T=limit(T,0,active.duration);selected=null;performing=false;artifact=null;blend=0;sync();buildRail();dirty=true;writeLink();say("Drag to explore. Tap a thing, or choose one below.");}
function sync(){
 document.body.dataset.ready=String(!!active&&!busy);document.body.dataset.scene=active?.entry.id||"";document.body.dataset.object=selected?.id||"";document.body.dataset.face=selected?.face||"";document.body.dataset.performing=String(performing);
 $("back").disabled=busy||(!selected&&!history.length);
 $("back").textContent=selected?"← Scene":"← Back";
 $("title").textContent=selected?selected.name:(active?.entry.title||"Opening the Odyssey");
 $("eyebrow").textContent=selected?selected.type.replace(/_/g," ").toUpperCase()+" · BOOK "+active.entry.book:"HOUSE OF DUST · ODYSSEY";
 $("states").hidden=!selected;$("stateLabel").hidden=!selected;
 $("timeLabel").textContent=selected?(performing?"Performance":"Transform"):"Scene time";
 $("time").disabled=busy||!!selected&&!performing&&selected.nodes.length<2;
 $("clock").textContent=selected?(performing?"":selected.nodes[stateIndex]?.key||""):(Math.floor(T)+" / "+Math.floor(active?.duration||0)+"s");
 $("play").textContent=playing?"Pause":"Play";$("play").setAttribute("aria-pressed",String(playing));
 $("room").hidden=!!selected;$("room").textContent=camera.zoom===0?"Fill screen":"Whole scene";
 $("hear").hidden=!selected?.face||!PERF?.voice[active?.entry.id];
 $("hear").textContent=au.paused?"Hear voice":"Stop voice";
 $("perform").hidden=!selected||!SPECIAL[selected.id];$("perform").textContent=performing?"Atlas drawing":"Perform";
 $("scenePrev").disabled=busy||!active||MF.scenes.indexOf(active.entry)===0;
 $("sceneNext").disabled=busy||!active||MF.scenes.indexOf(active.entry)===MF.scenes.length-1;
 $("railPrev").disabled=busy||railPage===0;$("railNext").disabled=busy||(railPage+1)*railSize>=objects.length;
 $("count").textContent=objects.length?Math.min(objects.length,railPage*railSize+1)+"–"+Math.min(objects.length,(railPage+1)*railSize)+" / "+objects.length:"";
 $("retry").hidden=!errorText;
}
function printDots(ctx,source,W,H,cell=3){
 const data=source.getContext("2d",{willReadFrequently:true}).getImageData(0,0,W,H).data;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
 const buckets=Array.from({length:12},()=>[]);
 for(let y=cell/2;y<H;y+=cell)for(let x=cell/2;x<W;x+=cell){

function buildRail(){

 const subset=objects.slice(railPage*railSize,(railPage+1)*railSize);
 for(const a of subset){
  const button=document.createElement("button");button.className="object";button.dataset.id=a.id;
  button.setAttribute("aria-label","Inspect "+a.name);button.setAttribute("aria-pressed",String(a.id===selected?.id));

  const label=document.createElement("span");label.textContent=a.name;
  button.append(canvas,label);button.onclick=()=>{if(busy)return;selectObject(a.id).catch(e=>say(e.message,true));};$("rail").append(button);
  getModule(a.id).then(mod=>{

   const cut=E.inkCutout(mod,{},"dust-explore-thumb"),s=Math.min(140/cut.w,90/cut.h);
   const raw=document.createElement("canvas");raw.width=150;raw.height=100;const ctx=raw.getContext("2d");
   ctx.fillStyle=PAPER;ctx.fillRect(0,0,150,100);ctx.drawImage(cut.cv,cut.x,cut.y,cut.w,cut.h,(150-cut.w*s)/2,(100-cut.h*s)/2,cut.w*s,cut.h*s);
   printDots(canvas.getContext("2d"),raw,150,100,1.7);

function renderScene(){

function mapping(){
 const W=work.width,H=work.height;
 const s=(camera.zoom===0?Math.min(W/SW,H/SH):Math.max(W/SW,H/SH)*camera.zoom);
 return {s,ox:W/2-camera.x*s,oy:H/2-camera.y*s};

function draw(){
 if(!active){g.fillStyle=PAPER;g.fillRect(0,0,cv.width,cv.height);return;}

  // The scene remains the context; the selected object's own drawing gets the frame.
  wg.globalAlpha=.13;wg.drawImage(field,m.ox,m.oy,SW*m.s,SH*m.s);wg.globalAlpha=1;
  if(selected.face&&PERF){

   artifact.draw(ac.getContext("2d"),720,720,(T%10)/10);
   const size=Math.min(W*.94,H*.86);wg.drawImage(ac,(W-size)/2,(H-size)/2,size,size);
  }else{
   const st=currentState(),cut=E.inkCutout(selected.mod,st,"explore-state-"+stateIndex+"-"+Math.round(blend*30));

function resize(){

}
new ResizeObserver(resize).observe($("viewport"));
function tick(now){
 if(!document.hidden){
  if(!last)last=now;const dt=Math.min(.06,(now-last)/1000);last=now;
  if(!au.paused){T=au.currentTime;if(T>=voiceEnd){au.pause();playing=false;sync();}dirty=true;}
  else if(playing&&active&&!busy){T+=dt;if(!selected&&T>active.duration)T=0;dirty=true;}
  if(dirty&&now-(tick.paint||0)>80){
   try{draw();tick.paint=now;}catch(e){playing=false;say("Drawing stopped: "+e.message,true);dirty=false;}
  }
  if(active&&!selected&&!drag)$("time").value=Math.round(T/active.duration*1000);
  $("clock").textContent=selected?(performing?"":selected.nodes[stateIndex]?.key||""):(Math.floor(T)+" / "+Math.floor(active?.duration||0)+"s");
 }

}

$("states").onchange=()=>{stateIndex=+$("states").value;blend=0;performing=false;$("time").value=selected.nodes.length>1?stateIndex/(selected.nodes.length-1)*1000:0;dirty=true;sync();writeLink();};

$("railPrev").onclick=()=>{railPage--;buildRail();};$("railNext").onclick=()=>{railPage++;buildRail();};
$("perform").onclick=async()=>{
 if(performing){performing=false;sync();dirty=true;return;}
 const wanted=selected?.id;
 try{if(!artifacts)artifacts=(await delay(import("./scenes/_artifacts.mjs"))).ARTIFACTS;
 if(selected?.id!==wanted)return;
 artifact=artifacts.find(a=>a.id===SPECIAL[wanted]);if(!artifact)throw Error("Performance unavailable.");

 }catch(e){say(e.message,true);}
};
$("retry").onclick=()=>{if(MF)openScene(active?.entry.id||START,{push:false});else boot();};
function pointerPosition(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
cv.onpointerdown=e=>{if(selected||busy||!active)return;activePointer=e.pointerId;cv.setPointerCapture(e.pointerId);drag={start:pointerPosition(e),camera:{...camera},distance:0};};
cv.onpointermove=e=>{
 if(!drag||e.pointerId!==activePointer)return;const p=pointerPosition(e),m=mapping(),dx=p.x-drag.start.x,dy=p.y-drag.start.y;
 drag.distance=Math.hypot(dx,dy);camera.x=limit(drag.camera.x-dx/m.s,0,SW);camera.y=limit(drag.camera.y-dy/m.s,0,SH);dirty=true;
};
cv.onpointerup=e=>{
 if(!drag||e.pointerId!==activePointer)return;const was=drag;drag=null;activePointer=null;
 if(was.distance>9)return;
 const p=pointerPosition(e),m=mapping(),x=(p.x-m.ox)/m.s,y=(p.y-m.oy)/m.s;
 const target=hits.filter(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h).sort((a,b)=>a.w*a.h-b.w*b.h)[0];
 if(target)selectObject(target.id).catch(e=>say(e.message,true));
};
cv.onpointercancel=cv.onlostpointercapture=()=>{drag=null;activePointer=null;};
cv.onwheel=e=>{if(selected)return;e.preventDefault();camera.zoom=limit((camera.zoom||.7)*Math.exp(-e.deltaY*.001),.6,2.5);dirty=true;sync();};
cv.addEventListener("wheel",()=>{},{passive:false});
addEventListener("keydown",e=>{
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$("source").open)return;
 if(e.key==="Escape"&&selected)returnScene();
 if(e.key===" "){e.preventDefault();$("play").click();}
 if(!selected&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();camera.x=limit(camera.x+(e.key==="ArrowRight"?55:e.key==="ArrowLeft"?-55:0),0,SW);camera.y=limit(camera.y+(e.key==="ArrowDown"?55:e.key==="ArrowUp"?-55:0),0,SH);dirty=true;}
});
function scoreLines(){
 if(!active)return [];
 const thing=selected||objects.find(a=>a.type==="prop")||objects[0];
 const loc=assetEntry(active.locationId),people=objects.filter(a=>a.type==="character").slice(0,3).map(a=>a.name);
 return ["A HOUSE OF "+(thing?.name||"RETURN").toUpperCase(),"IN "+(loc?.name||active.entry.bookTitle||"THE ODYSSEY").toUpperCase(),
 "USING "+(selected?selected.nodes[stateIndex]?.key||"ITS DRAWING":"THE SCENE'S AUTHORED LIGHT").toUpperCase(),
 "INHABITED BY "+(people.length?people.join(" AND "):"THE THINGS LEFT THERE").toUpperCase()];
}
function paginate(){
 const area=$("sourceText"),r=area.getBoundingClientRect(),cols=Math.max(18,Math.floor(r.width/7.3)),rows=Math.max(3,Math.floor(r.height/19));
 const wrapped=[];
 for(const line of sourceRaw.split("\n")){
  if(!line.length){wrapped.push("");continue;}
  for(let i=0;i<line.length;i+=cols)wrapped.push(line.slice(i,i+cols));
 }
 sourcePages=[];for(let i=0;i<wrapped.length;i+=rows)sourcePages.push(wrapped.slice(i,i+rows).join("\n"));
 if(!sourcePages.length)sourcePages=[""];sourcePage=limit(sourcePage,0,sourcePages.length-1);
 area.textContent=sourcePages[sourcePage];$("pageNumber").textContent=(sourcePage+1)+" / "+sourcePages.length;
 $("sourcePrev").disabled=sourcePage===0;$("sourceNext").disabled=sourcePage===sourcePages.length-1;
}
async function showSource(tab){
 sourceTab=tab;sourcePage=0;const token=++sourceToken;
 document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tab===tab)));
 const a=selected||assetEntry(active?.locationId);

 if(tab==="score")sourceRaw=scoreLines().join("\n\n")+"\n\n"+(NOTES[selected?.id]||"Original combinatorial score after Knowles and Tenney; not a quotation from Homer.")+"\n\nSCENE\n"+(active?.entry.beats||[]).join("\n\n");
 if(tab==="prompt")sourceRaw=(a?.prompt||active?.entry.composePrompt||"No prompt recorded.")+"\n\n"+(active?.context?"Setting supplied by an earlier scene in this book.":"The authored scene supplies its own setting.");
 if(tab==="code"){
  sourceRaw="Loading the drawing's source…";paginate();
  try{const path=selected?.face?"assets/character/_close/face.mjs":performing?"scenes/_artifacts.mjs":a?.path?.replace(/^\/+/,"")||active.entry.path.replace(/^\/+/,"");
   const res=await delay(fetch("./"+path));if(!res.ok)throw Error("Source unavailable.");const text=await res.text();if(token!==sourceToken)return;sourceRaw=text;
  }catch(e){sourceRaw=e.message;}

async function boot(){
 setBusy(true);say("Opening the atlas…");
 try{
  const [engine,data]=await Promise.all([delay(import("./engine/halfworld-engine.mjs")),delay(fetch("./viewer/odyssey-manifest.json").then(r=>{if(!r.ok)throw Error("Atlas unavailable.");return r.json();}))]);

async function loadPerformers(){
 if(PERF)return;
 const read=path=>delay(fetch("./"+path).then(r=>{if(!r.ok)throw Error(path+" unavailable");return r.json();}));
 const [FACE,SPEECH,DIR,script,voice,spoken]=await Promise.all([
  delay(import("./assets/character/_close/face.mjs")),delay(import("./engine/speech.mjs")),
  delay(import("./scenes/_direction.mjs")),read("drive/drive-script.json"),read("drive/voice-manifest.json"),read("viewer/spoken-lines.json")
 ]);

}
function faceFor(id){
 if(!PERF||!id||id.startsWith("PERFORMER."))return null;
 const slug=id.split(".").slice(1).join(".").split("-")[0];
 return Object.keys(PERF.FACE.FACES).find(k=>slug===k||slug.startsWith(k))||null;
}
function turnsFor(){
 if(!PERF||!active)return [];
 if(PERF.cache.has(active.entry.id))return PERF.cache.get(active.entry.id);
 const script=PERF.script.scenes.find(s=>s.id===active.entry.id),voice=PERF.voice[active.entry.id];
 const turns=(voice?.segments||[]).map(v=>{
  const d=script?.segments?.[v.gi];if(!d)return null;
  const text=PERF.spoken[d.sourceTurnId]?.line||d.text||"",dur=Math.max(.1,+v.dur||0);
  const track=PERF.SPEECH.visemeTrack(text,dur),HZ=50,env=new Float32Array(Math.max(1,Math.ceil(dur*HZ)));
  for(let i=0;i<env.length;i++){const v=track.find(v=>i/HZ>=v.t0&&i/HZ<v.t1),mouth=PERF.SPEECH.VISEMES[v?.v]||PERF.SPEECH.VISEMES.REST;env[i]=Math.min(1,.16+mouth.jaw*.95);}
  return {start:+v.start||0,dur,face:faceFor(d.speakerId),text,track,env,HZ};
 }).filter(Boolean);
 PERF.cache.set(active.entry.id,turns);return turns;
}
function drawPerformer(ctx,W,H){
 const name=selected.face,seed=name.length+name.charCodeAt(0),turn=turnsFor().find(q=>T>=q.start&&T<q.start+q.dur);
 const local=turn?T-turn.start:0,voicing=!!turn&&turn.face===name&&!au.paused;
 const idle=PERF.FACE.idleFace(T,seed);
 let state={...idle,...currentState()};
 if(voicing){
  const car=PERF.SPEECH.speechCarriage(turn.env,turn.HZ,local,seed),mouth=PERF.SPEECH.sampleMouth(turn.track,turn.env,turn.HZ,local);
  state={...state,...mouth,headPitch:(state.headPitch||0)+car.pitch,headYaw:(state.headYaw||0)+car.yaw,headRoll:(state.headRoll||0)+car.roll,browUp:(state.browUp||0)+car.brow*.6};
 }else if(turn&&!au.paused){
  const c=PERF.SPEECH.listenCarriage(turn.env,turn.HZ,local,seed);
  state={...state,jaw:0,headPitch:c.pitch,headYaw:c.yaw,headRoll:c.roll,browUp:c.brow,press:c.press,blink:(idle.blink||0)*c.blinkGate};
 }
 const size=Math.min(W*.94,H*.92),raw=document.createElement("canvas");raw.width=raw.height=800;const p=raw.getContext("2d");
 p.fillStyle=PAPER;p.fillRect(0,0,800,800);
 PERF.FACE.drawCloseup(p,PERF.FACE.FACES[name],state,{cx:400,cy:376,R:320});
 ctx.drawImage(raw,(W-size)/2,(H-size)/2,size,size);
}
$("hear").onclick=async()=>{
 if(!au.paused){au.pause();playing=false;sync();return;}
 const v=PERF?.voice[active?.entry.id];if(!v?.file)return;
 const turns=turnsFor(),turn=turns.find(t=>t.face===selected.face)||turns[0];if(!turn)return;
 try{
  const src=new URL("./"+v.file,location.href).href;
  if(au.src!==src){au.preload="auto";au.src=src;au.load();}
  if(au.readyState<1)await delay(new Promise((resolve,reject)=>{
   const clean=()=>{au.removeEventListener("loadedmetadata",ready);au.removeEventListener("error",fail);};
   const ready=()=>{clean();resolve();},fail=()=>{clean();reject(Error("Recording metadata unavailable."));};
   au.addEventListener("loadedmetadata",ready,{once:true});au.addEventListener("error",fail,{once:true});
  }));
  voiceEnd=turn.start+turn.dur;au.currentTime=turn.start;T=turn.start;
  await au.play();playing=true;sync();say(turn.text);
 }catch(e){say("The recording could not play. "+e.message,true);sync();}
};
au.onended=()=>{playing=false;sync();};
au.onerror=()=>{playing=false;say("The scene recording could not be loaded.",true);sync();};

requestAnimationFrame(tick);boot();
